<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEVEL 2 - 32 QUESTIONS - FULL RANDOM 100%</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#00695C,#26A69A);margin:0;padding:15px;display:flex;justify-content:center;min-height:100vh}
.container{max-width:650px;width:100%;background:#fff;padding:20px;border-radius:20px;border:3px solid #004D40;text-align:center}
.timer{height:12px;background:#B2DFDB;border-radius:6px;overflow:hidden;margin:10px 0}
#timerBar{height:100%;background:linear-gradient(90deg,#00C853,#FFEB3B,#FF1744);width:100%;transition:width 0.1s linear}
.soal{font-size:18px;font-weight:900;margin:15px 0;min-height:60px;color:#004D40;text-align:left}
.pil{padding:12px;background:#E0F2F1;border:2px solid #4DB6AC;border-radius:10px;cursor:pointer;font-weight:700;margin-bottom:7px;color:#004D40;text-align:left;font-size:14px}
.pil.bener{background:#00C853!important;color:#fff;border-color:#00C853}
.pil.salah{background:#FF3D00!important;color:#fff;border-color:#FF3D00}
.info{display:flex;justify-content:space-between;font-weight:900;color:#00796B;font-size:14px}
#hasil{line-height:1.6}
.btn-next{display:none;margin:15px auto;padding:14px 25px;background:#FF6F00;color:#fff;border:none;border-radius:12px;font-weight:900;cursor:pointer;width:100%;animation:bounce 1s infinite}
.btn-ulang{margin:8px auto;padding:12px 20px;background:#E0F2F1;color:#004D40;border:2px solid #004D40;border-radius:12px;font-weight:900;cursor:pointer;display:none;width:100%}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</head>
<body>
<div class="container">
<h2 style="color:#004D40">🔵 LEVEL 2 - 32 QUESTIONS - FULL RANDOM 100%</h2>
<div class="info"><span id="noSoal">Question 1/32</span><span id="benar">CORRECT: 0/32</span><span id="totalTimer">96.0s</span></div>
<div class="timer"><div id="timerBar"></div></div>
<div class="soal" id="soalText"></div>
<div id="pilihan"></div>
<div id="hasil" style="font-weight:900;color:#004D40;margin-top:15px"></div>
<button id="btnNext" class="btn-next" onclick="lanjutKeLevel3()">➡️ CONTINUE TO LEVEL 3 (100% CORRECT) ➡️</button>
<button id="btnUlang" class="btn-ulang" onclick="location.reload()">🔁 REPLAY LEVEL 2 (SHUFFLE AGAIN)</button>
<div style="margin-top:10px"><a href="level1.html" style="color:#00796B;font-weight:900;text-decoration:none">⬅️ Back to Level 1</a></div>
</div>
<script>
const SOAL_ORIG=[
{q:"Which enzyme breaks down protein in the stomach?",a:["Amylase","Pepsin","Lipase","Trypsin"],k:1},
{q:"Which hormone regulates blood sugar?",a:["Adrenaline","Insulin","Thyroxine","Estrogen"],k:1},
{q:"Which part of the brain is for balance?",a:["Cerebrum","Cerebellum","Medulla","Hypothalamus"],k:1},
{q:"What is the smallest blood vessel?",a:["Artery","Vein","Capillary","Aorta"],k:2},
{q:"What is the process of making food in plants?",a:["Respiration","Photosynthesis","Transpiration","Fermentation"],k:1},
{q:"What is the most abundant element in the universe?",a:["Oxygen","Hydrogen","Carbon","Helium"],k:1},
{q:"What is the speed of light?",a:["300,000 km/s","150,000 km/s","500,000 km/s","100,000 km/s"],k:0},
{q:"What is the largest planet?",a:["Earth","Mars","Jupiter","Saturn"],k:2},
{q:"What is the strong acid in the stomach?",a:["H2SO4","HCl","HNO3","CH3COOH"],k:1},
{q:"What is the universal donor blood type?",a:["A","B","AB","O"],k:3},
{q:"What is the blood pressure measuring tool?",a:["Thermometer","Sphygmomanometer","Barometer","Stethoscope"],k:1},
{q:"Which vitamin is for blood clotting?",a:["A","K","C","D"],k:1},
{q:"How many chromosomes do humans have?",a:["44","46","48","23"],k:1},
{q:"Which bacteria causes TB?",a:["E.coli","Mycobacterium","Streptococcus","Salmonella"],k:1},
{q:"What is the outermost layer of the earth?",a:["Core","Mantle","Crust","Asthenosphere"],k:2},
{q:"What is the main greenhouse gas?",a:["O2","CO2","N2","H2"],k:1},
{q:"What is normal blood pH?",a:["6.8","7.4","8.0","7.0"],k:1},
{q:"The heart muscle is what type of muscle?",a:["Striated","Smooth","Cardiac","Skeletal"],k:2},
{q:"Which animal is cold-blooded?",a:["Mammal","Reptile","Bird","Mammal"],k:1},
{q:"What is the chemical formula for water?",a:["H2O","CO2","O2","H2O2"],k:0},
{q:"Which organ filters blood?",a:["Liver","Kidney","Heart","Lung"],k:1},
{q:"What is the happiness hormone?",a:["Cortisol","Serotonin","Adrenaline","Thyroxine"],k:1},
{q:"Which part of the eye sees color?",a:["Cornea","Retina","Lens","Iris"],k:1},
{q:"What is the process of cell division?",a:["Mitosis","Meiosis","Both","Fusion"],k:2},
{q:"Which element has the symbol Fe?",a:["Fluorine","Iron","Copper","Silver"],k:1},
{q:"What is the speed of sound in air?",a:["340 m/s","540 m/s","240 m/s","1000 m/s"],k:0},
{q:"What disease is caused by iodine deficiency?",a:["Anemia","Goiter","Rickets","Scurvy"],k:1},
{q:"What is the breathing apparatus of insects?",a:["Lung","Gill","Trachea","Skin"],k:2},
{q:"Which part of the cell produces energy?",a:["Nucleus","Mitochondria","Ribosome","Chloroplast"],k:1},
{q:"What is Newton's 1st Law about?",a:["Action-reaction","Inertia","Force","Momentum"],k:1},
{q:"Which is a noble gas element?",a:["Oxygen","Helium","Nitrogen","Hydrogen"],k:1},
{q:"Which is an autoimmune disease?",a:["Lupus","Flu","TB","Fever"],k:0}
];

function shuffle(arr){
  let a=[...arr];
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function acakJawaban(soal){
  let list = soal.a.map((txt,i)=>({txt, isBenar: i===soal.k}));
  list = shuffle(list);
  return {q: soal.q, a: list.map(x=>x.txt), k: list.findIndex(x=>x.isBenar)};
}
const SOAL = shuffle(SOAL_ORIG).map(s=>acakJawaban(s));

let idx=0,benar=0,totalTime=96,sisaTotal=96,timer,salahList=[];
function render(){
if(idx>=SOAL.length){end();return;}
document.getElementById('noSoal').innerText=`Question ${idx+1}/32`;
document.getElementById('soalText').innerText=`${idx+1}. ${SOAL[idx].q}`;
let div=document.getElementById('pilihan');div.innerHTML='';
SOAL[idx].a.forEach((t,i)=>{
let b=document.createElement('div');b.className='pil';b.innerText=`${String.fromCharCode(65+i)}. ${t}`;
b.onclick=()=>jawab(i);div.appendChild(b);
});
}
function jawab(pilih){
let k=SOAL[idx].k;
document.querySelectorAll('.pil').forEach((el,i)=>{
el.style.pointerEvents='none';
if(i===k) el.classList.add('bener');
if(i===pilih && i!==k) el.classList.add('salah');
});
if(pilih===k){benar++;}else{salahList.push(`${idx+1}. ${SOAL[idx].q} → Answer: ${SOAL[idx].a[k]}`);}
document.getElementById('benar').innerText=`CORRECT: ${benar}/32`;
setTimeout(()=>{idx++;render();},400);
}
function start(){
timer=setInterval(()=>{
sisaTotal-=0.1;
let per=(sisaTotal/totalTime)*100;
document.getElementById('timerBar').style.width=per+'%';
document.getElementById('totalTimer').innerText=sisaTotal.toFixed(1)+'s';
if(sisaTotal<=0){end();}
},100);
}
function lanjutKeLevel3(){
  if(benar!==32) return;
  localStorage.setItem('level2_benar', benar);
  window.location.href='level3.html';
}
function end(){
clearInterval(timer);
document.getElementById('soalText').innerText='LEVEL 2 COMPLETE!';
document.getElementById('pilihan').innerHTML='';
let listSalah = salahList.length>0? `<div style="text-align:left;margin-top:15px;background:#FFEBEE;padding:10px;border-radius:10px;font-size:13px;color:#B71C1C"><b>FAILED - WRONG ${salahList.length} QUESTIONS:</b><br>${salahList.join('<br>')}</div>` : `<div style="color:#00C853;margin-top:10px;font-size:18px">🔥 PERFECT 32/32!</div>`;
document.getElementById('hasil').innerHTML=`<div style="font-size:22px">CORRECT: ${benar} of 32</div><div style="font-size:13px;color:#555">${benar===32? '100%! Level 3 unlocked!' : 'You need 100% (32/32) to continue! Questions will shuffle if you replay!'}<br>Time left: ${sisaTotal.toFixed(1)}s</div>${listSalah}`;
document.getElementById('btnUlang').style.display='block';
if(benar===32){
  document.getElementById('btnNext').style.display='block';
}
}
render();start();
</script>
</body>
</html>
