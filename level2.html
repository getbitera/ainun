<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEVEL 2 - 32 SOAL - MODE 100%</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#00695C,#26A69A);margin:0;padding:15px;display:flex;justify-content:center;min-height:100vh}
.container{max-width:650px;width:100%;background:#fff;padding:20px;border-radius:20px;border:3px solid #004D40;text-align:center}
.timer{height:12px;background:#B2DFDB;border-radius:6px;overflow:hidden;margin:10px 0}
#timerBar{height:100%;background:linear-gradient(90deg,#00C853,#FFEB3B,#FF1744);width:100%;transition:width 0.1s linear}
.soal{font-size:18px;font-weight:900;margin:15px 0;min-height:60px;color:#004D40;text-align:left}
.pil{padding:12px;background:#E0F2F1;border:2px solid #4DB6AC;border-radius:10px;cursor:pointer;font-weight:700;margin-bottom:7px;color:#004D40;text-align:left;font-size:14px}
.pil.bener{background:#00C853!important;color:#fff;border-color:#00C853}
.pil.salah{background:#FF3D00!important;color:#fff;border-color:#FF3D00}
.info{display:flex;justify-content:space-between;font-weight:900;color:#00796B;font-size:14px}
#hasil{line-height:1.6}
.btn-next{display:none;margin:15px auto;padding:14px 25px;background:#FF6F00;color:#fff;border:none;border-radius:12px;font-weight:900;cursor:pointer;width:100%;animation:bounce 1s infinite}
.btn-ulang{margin:8px auto;padding:12px 20px;background:#E0F2F1;color:#004D40;border:2px solid #004D40;border-radius:12px;font-weight:900;cursor:pointer;display:none;width:100%}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</head>
<body>
<div class="container">
<h2 style="color:#004D40">🔵 LEVEL 2 - 32 SOAL - MODE 100%</h2>
<div class="info"><span id="noSoal">Soal 1/32</span><span id="benar">BENAR: 0/32</span><span id="totalTimer">96.0s</span></div>
<div class="timer"><div id="timerBar"></div></div>
<div class="soal" id="soalText"></div>
<div id="pilihan"></div>
<div id="hasil" style="font-weight:900;color:#004D40;margin-top:15px"></div>
<button id="btnNext" class="btn-next" onclick="lanjutKeLevel3()">➡️ LANJUT KE LEVEL 3 (100% BENAR) ➡️</button>
<button id="btnUlang" class="btn-ulang" onclick="location.reload()">🔁 ULANGI LEVEL 2</button>
<div style="margin-top:10px"><a href="level1.html" style="color:#00796B;font-weight:900;text-decoration:none">⬅️ Kembali ke Level 1</a></div>
</div>
<script>
const SOAL_ORIG=[
{q:"Enzim pemecah protein di lambung?",a:["Amilase","Pepsin","Lipase","Tripsin"],k:1},
{q:"Hormon pengatur gula darah?",a:["Adrenalin","Insulin","Tiroksin","Estrogen"],k:1},
{q:"Bagian otak untuk keseimbangan?",a:["Cerebrum","Cerebellum","Medula","Hipotalamus"],k:1},
{q:"Pembuluh darah terkecil?",a:["Arteri","Vena","Kapiler","Aorta"],k:2},
{q:"Proses pembuatan makanan pada tumbuhan?",a:["Respirasi","Fotosintesis","Transpirasi","Fermentasi"],k:1},
{q:"Unsur terbanyak di alam semesta?",a:["Oksigen","Hidrogen","Karbon","Helium"],k:1},
{q:"Kecepatan cahaya?",a:["300.000 km/s","150.000 km/s","500.000 km/s","100.000 km/s"],k:0},
{q:"Planet terbesar?",a:["Bumi","Mars","Jupiter","Saturnus"],k:2},
{q:"Asam kuat di lambung?",a:["H2SO4","HCl","HNO3","CH3COOH"],k:1},
{q:"Golongan darah universal donor?",a:["A","B","AB","O"],k:3},
{q:"Alat ukur tekanan darah?",a:["Termometer","Sfigmomanometer","Barometer","Stetoskop"],k:1},
{q:"Vitamin untuk pembekuan darah?",a:["A","K","C","D"],k:1},
{q:"Jumlah kromosom manusia?",a:["44","46","48","23"],k:1},
{q:"Bakteri penyebab TBC?",a:["E.coli","Mycobacterium","Streptococcus","Salmonella"],k:1},
{q:"Lapisan bumi paling luar?",a:["Inti","Mantel","Kerak","Astenosfer"],k:2},
{q:"Gas rumah kaca utama?",a:["O2","CO2","N2","H2"],k:1},
{q:"pH darah normal?",a:["6,8","7,4","8,0","7,0"],k:1},
{q:"Otot jantung termasuk otot?",a:["Lurik","Polos","Jantung","Rangka"],k:2},
{q:"Hewan berdarah dingin?",a:["Mamalia","Reptil","Burung","Mamalia"],k:1},
{q:"Rumus kimia air?",a:["H2O","CO2","O2","H2O2"],k:0},
{q:"Organ penyaring darah?",a:["Hati","Ginjal","Jantung","Paru"],k:1},
{q:"Hormon kebahagiaan?",a:["Kortisol","Serotonin","Adrenalin","Tiroksin"],k:1},
{q:"Bagian mata untuk melihat warna?",a:["Kornea","Retina","Lensa","Iris"],k:1},
{q:"Proses pembelahan sel?",a:["Mitosis","Meiosis","Keduanya","Fusi"],k:2},
{q:"Unsur dengan simbol Fe?",a:["Fluor","Besi","Tembaga","Perak"],k:1},
{q:"Kecepatan suara di udara?",a:["340 m/s","540 m/s","240 m/s","1000 m/s"],k:0},
{q:"Penyakit kekurangan yodium?",a:["Anemia","Gondok","Rakhitis","Scurvy"],k:1},
{q:"Alat pernapasan serangga?",a:["Paru","Insang","Trakea","Kulit"],k:2},
{q:"Bagian sel penghasil energi?",a:["Nukleus","Mitokondria","Ribosom","Kloroplas"],k:1},
{q:"Hukum Newton 1 tentang?",a:["Aksi-reaksi","Kelembaman","Gaya","Momentum"],k:1},
{q:"Unsur gas mulia?",a:["Oksigen","Helium","Nitrogen","Hidrogen"],k:1},
{q:"Penyakit autoimun?",a:["Lupus","Flu","TBC","Demam"],k:0}
];

function acakJawaban(soal){
  let list = soal.a.map((txt,i)=>({txt, isBenar: i===soal.k}));
  for(let i=list.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [list[i],list[j]]=[list[j],list[i]];
  }
  return {q: soal.q, a: list.map(x=>x.txt), k: list.findIndex(x=>x.isBenar)};
}
const SOAL = SOAL_ORIG.map(s=>acakJawaban(s));

let idx=0,benar=0,totalTime=96,sisaTotal=96,timer,salahList=[];
function render(){
if(idx>=SOAL.length){end();return;}
document.getElementById('noSoal').innerText=`Soal ${idx+1}/32`;
document.getElementById('soalText').innerText=`${idx+1}. ${SOAL[idx].q}`;
let div=document.getElementById('pilihan');div.innerHTML='';
SOAL[idx].a.forEach((t,i)=>{
let b=document.createElement('div');b.className='pil';b.innerText=`${String.fromCharCode(65+i)}. ${t}`;
b.onclick=()=>jawab(i);div.appendChild(b);
});
}
function jawab(pilih){
let k=SOAL[idx].k;
document.querySelectorAll('.pil').forEach((el,i)=>{
el.style.pointerEvents='none';
if(i===k) el.classList.add('bener');
if(i===pilih && i!==k) el.classList.add('salah');
});
if(pilih===k){benar++;}else{salahList.push(`${idx+1}. ${SOAL[idx].q} → Jawab: ${SOAL[idx].a[k]}`);}
document.getElementById('benar').innerText=`BENAR: ${benar}/32`;
setTimeout(()=>{idx++;render();},400);
}
function start(){
timer=setInterval(()=>{
sisaTotal-=0.1;
let per=(sisaTotal/totalTime)*100;
document.getElementById('timerBar').style.width=per+'%';
document.getElementById('totalTimer').innerText=sisaTotal.toFixed(1)+'s';
if(sisaTotal<=0){end();}
},100);
}
function lanjutKeLevel3(){
  if(benar!==32) return;
  localStorage.setItem('level2_benar', benar);
  window.location.href='level3.html';
}
function end(){
clearInterval(timer);
document.getElementById('soalText').innerText='LEVEL 2 SELESAI!';
document.getElementById('pilihan').innerHTML='';
let listSalah = salahList.length>0? `<div style="text-align:left;margin-top:15px;background:#FFEBEE;padding:10px;border-radius:10px;font-size:13px;color:#B71C1C"><b>GAGAL - SALAH ${salahList.length} SOAL:</b><br>${salahList.join('<br>')}</div>` : `<div style="color:#00C853;margin-top:10px;font-size:18px">🔥 SEMPURNA 32/32! LO GILA!</div>`;
document.getElementById('hasil').innerHTML=`<div style="font-size:22px">BENAR: ${benar} dari 32</div><div style="font-size:13px;color:#555">${benar===32? '100%! Lanjut Level 3 kebuka!' : 'Wajib 100% (32/32) untuk lanjut Level 3!'}<br>Waktu sisa: ${sisaTotal.toFixed(1)}s</div>${listSalah}`;
document.getElementById('btnUlang').style.display='block';
if(benar===32){
  document.getElementById('btnNext').style.display='block';
}
}
render();start();
</script>
</body>
</html>
