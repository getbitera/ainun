body{margin:0;font-family:'Fredoka',sans-serif;background:#FFF0F5;display:flex;justify-content:center;padding:15px 0;min-height:100vh}

.sub{color:#888;font-size:12px;line-height:1.5}

.input{width:100%;padding:14px;border-radius:20px;border:2px solid #FFD1E3;outline:none;font-size:16px;text-align:center;box-sizing:border-box}
.korean{font-family:'Noto Sans KR',sans-serif;font-size:38px;line-height:1.4;color:#FF4D8D;font-weight:700;margin:12px 0;word-break:break-word}

.option.correct{background:#22C55E;color:white;border-color:#22C55E}
.option.wrong{background:#EF4444;color:white;border-color:#EF4444}
.progress{height:8px;background:#FFD1E3;border-radius:10px;overflow:hidden;margin:10px 0}
.bar{height:100%;background:#FF4D8D;transition:.3s}
.hide{display:none}
.levelGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.levelCard{background:#FFF0F5;border:2px solid #FFD1E3;border-radius:18px;padding:14px;cursor:pointer;text-align:left}
.levelCard b{font-size:15px}
.levelCard p{margin:4px 0 0;font-size:11px;color:#888}
.levelCard .emoji{font-size:24px}
.badge{display:inline-block;background:#FFD1E3;color:#FF4D8D;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.speakBtn{background:#222;color:white;border:none;padding:10px 18px;border-radius:20px;cursor:pointer;font-size:14px;margin:8px 0}
.result-box{text-align:left;background:#FFF0F5;padding:16px;border-radius:18px;font-size:14px;line-height:1.7}
</style>
</head>

<div class="card" id="intro">

<h1>Learn Korean<br>Baca Tulisan Korea</h1>
<p class="sub">Level 1: 40 Huruf Hangul<br>Level 2: 200 Kata<br>Level 3: 200 Kalimat Penuh!<br>Semua Level Langsung Kebuka!</p>
<input class="input" id="playerName" placeholder="Type your name...">
<button class="btn" onclick="goLevels()">START ▶</button>
</div>

<div class="card hide" id="levelScreen">
<h2 id="helloName">Hi!</h2>
<p class="sub">⭐ Score: <b id="totalScore">0</b> | 🔓 Semua Level Terbuka!</p>
<div class="levelGrid" id="levelGrid"></div>
<button class="btn btn2" onclick="location.reload()">Ganti Nama</button>
</div>

<div class="card hide" id="quizScreen">
<div class="progress"><div class="bar" id="bar"></div></div>
<p class="sub" id="qCount"></p>
<span class="badge" id="qLevel"></span>
<div class="korean" id="qKorean"></div>
<button class="speakBtn" onclick="speakKorean()">🔊 Dengerin Bunyinya</button>
<h2 id="qTitle"></h2>
<div id="qOptions"></div>
<button class="btn hide" id="nextBtn" onclick="nextQ()">Next ➜</button>
<p class="sub" id="reviewTxt"></p>
</div>

<div class="card hide" id="resultScreen">
<div style="font-size:48px">🎉</div>
<h1 id="resTitle"></h1>
<div class="result-box" id="resText"></div>
<button class="btn" onclick="backToLevels()">Pilih Level Lagi</button>
<button class="btn btn2" onclick="retryLevel()">Ulangi Level Ini</button>
</div>

function buildL10(){
  let out=[...L10_MANUAL];
  let seen=new Set(out.map(x=>x[0]));
  const times=[
    ["오늘","today"],["내일","tomorrow"],["어제","yesterday"],
    ["아침에","in the morning"],["저녁에","in the evening"],
    ["매일","every day"],["지금","now"]
  ];
  let idx=0;
  while(out.length<1000 && idx<6000){
    idx++;
    const p=LOGICAL_PAIRS_KR[idx%LOGICAL_PAIRS_KR.length];
    const t=times[idx%times.length];
    const subjKr=["저는","당신은","그는","우리는"][idx%4];
    const subjEn=["I","You","He","We"][idx%4];

    // Soal: Korea - Subjek + Waktu + Tempat + Objek + Verb (Verb paling belakang)
    // Jawaban: English - Subjek + Verb + Objek + Tempat + Waktu (Verb di depan)
    const verbKr=p[0], verbEn=p[1], objKr=p[2], objEn=p[3], placeKr=p[4], placeEn=p[5];
    const timeKr=t[0], timeEn=t[1];

    let thai, eng;
    if(objKr==="" && placeKr===""){
      thai=`${subjKr} ${timeKr} ${verbKr}`;
      eng=`${subjEn} ${verbEn} ${timeEn}`;
    } else if(objKr===""){
      thai=`${subjKr} ${timeKr} ${placeKr} ${verbKr}`;
      eng=`${subjEn} ${verbEn} ${placeEn} ${timeEn}`;
    } else if(placeKr===""){
      thai=`${subjKr} ${timeKr} ${objKr} ${verbKr}`;
      eng=`${subjEn} ${verbEn} ${objEn} ${timeEn}`;
    } else {
      thai=`${subjKr} ${timeKr} ${placeKr} ${objKr} ${verbKr}`;
      eng=`${subjEn} ${verbEn} ${objEn} ${placeEn} ${timeEn}`;
    }

    thai=thai.replace(/\s+/g,' ').trim();
    eng=eng.replace(/\s+/g,' ').trim();
    if(!seen.has(thai) && thai.length>5){ seen.add(thai); out.push([thai, eng]); }
  }
  return out.slice(0,1000);
}

function renderLevels(){
  const grid=document.getElementById('levelGrid'); grid.innerHTML='';
  document.getElementById('totalScore').innerText=totalScore;
  LEVELS.forEach(l=>{
    const div=document.createElement('div'); div.className='levelCard';
    div.innerHTML=`<div class="emoji">${l.emoji}</div><b>${l.title}</b><p>${l.desc}</p><p>▶ Mainkan</p>`;
    div.onclick=()=>{ startLevel(l.id); };
    grid.appendChild(div);
  });
}
function startLevel(id){
  currentLevel=id; idx=0; score=0;
  const lvl=LEVELS.find(l=>l.id===id);
  currentPool=[...lvl.pool].sort(()=>Math.random()-0.5);
  document.getElementById('levelScreen').classList.add('hide');
  document.getElementById('quizScreen').classList.remove('hide');
  showQ();
}
function getOptions(correct, allAnswers){
  let others=[...new Set(allAnswers.filter(a=>a!==correct))].sort(()=>Math.random()-0.5).slice(0,3);
  return [correct, ...others].sort(()=>Math.random()-0.5);
}
function showQ(){
  const lvl=LEVELS.find(l=>l.id===currentLevel);
  const curPair=currentPool[idx];
  const kor=curPair[0], ans=curPair[1];
  currentQ={thai:kor, ans};
  const allAns = currentPool.map(p=>p[1]);
  const opts=getOptions(ans, allAns);
  document.getElementById('qCount').innerText=`Question ${idx+1} of ${currentPool.length} • Score: ${score}`;
  document.getElementById('qLevel').innerText=lvl.title;
  document.getElementById('bar').style.width=((idx/currentPool.length)*100)+'%';
  document.getElementById('qKorean').innerText=kor;
  document.getElementById('qTitle').innerText=lvl.q;
  document.getElementById('reviewTxt').innerText='';
  const box=document.getElementById('qOptions'); box.innerHTML='';
  opts.forEach(o=>{
    let d=document.createElement('div'); d.className='option'; d.innerText=o;
    d.onclick=()=>{
      if(d.classList.contains('correct')||d.classList.contains('wrong')) return;
      document.querySelectorAll('.option').forEach(x=>{
        if(x.innerText===ans) x.classList.add('correct');
        else if(x===d) x.classList.add('wrong');
        x.style.pointerEvents='none';
      });
      if(o===ans){ score+=10; totalScore+=10; speakEN('Correct!'); } else { speakEN('Wrong.'); }
      document.getElementById('reviewTxt').innerText=`${kor} = ${ans}`;
      document.getElementById('nextBtn').classList.remove('hide');
      setTimeout(()=>speakKorean(kor), 500);
    };
    box.appendChild(d);
  });
  document.getElementById('nextBtn').classList.add('hide');
  speakKorean(kor);
}
function nextQ(){ idx++; if(idx<currentPool.length) showQ(); else showResult(); }
function showResult(){
  document.getElementById('quizScreen').classList.add('hide');
  document.getElementById('resultScreen').classList.remove('hide');
  const lvl=LEVELS.find(l=>l.id===currentLevel);
  const max=currentPool.length*10;
  const pass = score >= max*0.6;
  document.getElementById('resTitle').innerText= pass ? `Level ${currentLevel} LULUS! 🎉` : `Level ${currentLevel} Belum Lulus 😅`;
  document.getElementById('resText').innerText=`Hi ${name}!\n\nLevel: ${lvl.title}\nScore: ${score} / ${max}\nTotal Soal: ${currentPool.length}\n\n${pass ? 'Kamu hebat!' : 'Butuh 60% buat lulus. Coba lagi ya!'}\n\nTotal Score: ${totalScore}`;
  speakEN(pass ? `Congratulations ${name}, you passed level ${currentLevel}` : `Keep trying ${name}`);
}

function retryLevel(){ document.getElementById('resultScreen').classList.add('hide'); startLevel(currentLevel); }
