<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - AINUN JOB</title>
<style>
:root{--bg:#E8F0F4;--card:#FFF;--text:#2C3E50;--accent:#4A7C8A}
body{background:var(--bg);font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh}
.card{background:var(--card); padding:30px; border-radius:15px; border:3px solid var(--accent); width:90%; max-width:400px; box-shadow:0 4px 15px rgba(74,124,138,0.12)}
.input{width:100%; padding:12px; margin:10px 0; border:2px solid #D0E0E7; border-radius:8px}
.btn{width:100%; padding:15px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer}
.btn:hover{background:#3E6A77}
</style>
</head>
<body>
<div class="card">
  <img src="solusiin.png" style="width:60px; display:block; margin:0 auto 15px">
  <h2 style="text-align:center; color:var(--accent)">Ganti Password Baru</h2>
  <p id="status" style="text-align:center; color:gray">Silahkan masukkan password baru</p>
  <input class="input" type="password" id="passBaru" placeholder="Password Baru Min 6">
  <input class="input" type="password" id="passUlang" placeholder="Ulangi Password Baru">
  <button class="btn" onclick="simpanPasswordBaru()">SIMPAN PASSWORD</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://chzommcglipcoughsfzd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoem9tbWNnbGlwY291Z2hzZnpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNzQ0NzQsImV4cCI6MjEwMzk1MDQ3NH0.KGdiVr3C2QKNZF2tV8_DOBqu6knAb0pUbigE3IZzB0w";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Supabase otomatis login kan user pas buka link ini
async function simpanPasswordBaru(){
  const pass1 = document.getElementById('passBaru').value;
  const pass2 = document.getElementById('passUlang').value;
  
  if(pass1 !== pass2) return alert("Password tidak sama");
  if(pass1.length < 6) return alert("Password min 6 karakter");

  const { error } = await supabase.auth.updateUser({ password: pass1 });

  if(error) {
    document.getElementById('status').innerText = "Gagal: " + error.message;
    document.getElementById('status').style.color = "red";
  } else {
    document.getElementById('status').innerText = "Berhasil! Mengalihkan ke login...";
    document.getElementById('status').style.color = "green";
    setTimeout(()=> window.location.href = "https://myainun.vercel.app/", 2000);
  }
}
</script>
</body>
</html>
