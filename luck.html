<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUCK TEST 50:50 - 9 OBSTACLES @myainunsukamto</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
body{margin:0;background:#0f0f14;color:white;font-family:'Segoe UI',Arial;text-align:center;overflow-x:hidden}
.header{background:linear-gradient(90deg,#ff00ff,#00ffff);padding:12px;font-weight:900;letter-spacing:1px}
#game{max-width:420px;margin:0 auto;padding:10px;position:relative}
#levelInfo{font-size:14px;margin:8px 0;color:#ffcc80;font-weight:800}
#progress{display:flex;gap:4px;justify-content:center;margin:10px 0}
.dot{width:28px;height:28px;border-radius:50%;background:#222;border:2px solid #333;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;transition:0.4s}
.dot.pass{background:#00c853;border-color:#00ff88;color:white;box-shadow:0 0 10px #00ff88}
.dot.active{background:#ffea00;border-color:#ffea00;color:black;box-shadow:0 0 12px #ffea00;transform:scale(1.2)}
.dot.fail{background:#ff1744;border-color:#ff1744;animation:shake 0.4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#stage{position:relative;height:380px;background:linear-gradient(#1a1a2e 0%, #16213e 50%, #0f3460 100%);border-radius:20px;border:3px solid #333;overflow:hidden;margin:12px 0}
#char{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);font-size:42px;transition:all 0.6s cubic-bezier(.68,-0.55,.27,1.55);z-index:10}
#char.jumpA{left:22%;bottom:200px;transform:translateX(-50%) rotate(-15deg) scale(1.2)}
#char.jumpB{left:78%;bottom:200px;transform:translateX(-50%) rotate(15deg) scale(1.2)}
#char.fall{bottom:-100px;transform:translateX(-50%) rotate(720deg) scale(0.2);opacity:0;transition:1s}
.platform{position:absolute;top:80px;width:38%;height:90px;background:#222;border-radius:14px;border:3px solid #555;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:0.2s}
.platform:hover{transform:scale(1.05);border-color:white}
#platA{left:5%} #platB{right:5%}
.platform .icon{font-size:32px} .platform .label{font-size:18px;font-weight:900;margin-top:4px} .platform .sub{font-size:10px;color:#aaa}
.platform.safe{border-color:#00ff88;box-shadow:0 0 15px rgba(0,255,136,0.4)} .platform.trap{border-color:#ff1744;box-shadow:0 0 15px rgba(255,23,68,0.5)}
#trapView{position:absolute;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;padding:20px}
#trapView.show{display:flex} #trapIcon{font-size:80px}
.btn{padding:14px 28px;border:none;border-radius:30px;font-weight:900;font-size:16px;cursor:pointer;background:linear-gradient(90deg,#ff00ff,#ff4081);color:white;margin:10px;transition:0.2s}
.btn:active{transform:scale(0.95)} #log{font-size:12px;color:#aaa;min-height:40px;margin-top:8px;background:#111;border-radius:10px;padding:8px}
/* INTRO SCREEN NAMA */
#intro{position:fixed;inset:0;background:linear-gradient(135deg,#0f0f14,#1a1a2e);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}
#intro.hide{display:none}
#introBox{background:#212121;border:3px solid #ff00ff;border-radius:20px;padding:24px;max-width:360px;width:100%;box-shadow:0 0 30px rgba(255,0,255,0.3)}
#nameInput{width:100%;padding:14px;border-radius:30px;border:2px solid #333;background:#000;color:white;font-size:16px;text-align:center;margin:14px 0;box-sizing:border-box}
#aiAvatar{font-size:60px;margin-bottom:10px;animation:float 2s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#aiText{font-size:13px;color:#ffcc80;min-height:40px;margin:10px 0;line-height:1.4}
</style>
</head>
<body>
<div class="header">🍀 LUCK TEST 50:50 - 9 OBSTACLES 🍀</div>

<!-- INTRO INPUT NAMA -->
<div id="intro">
  <div id="introBox">
    <div id="aiAvatar">👩‍🦰</div>
    <div style="font-weight:900;font-size:18px">WELCOME TO LUCK TEST!</div>
    <div id="aiText">Hi! Enter your name first, and I will explain the game!</div>
    <input id="nameInput" placeholder="Enter your name..." maxlength="12" oninput="previewName()">
    <button class="btn" style="width:100%" onclick="startGame()">▶️ START GAME</button>
    <div style="font-size:10px;color:#666;margin-top:8px"><label><input type="checkbox" id="voiceCheck" checked> 🔊 Girl AI Voice</label></div>
  </div>
</div>

<div id="game">
  <div id="levelInfo">LEVEL 1 / 9</div>
  <div id="progress"></div>
  <div id="stage">
    <div id="platA" class="platform" onclick="choose('A')"><div class="icon">🅰️</div><div class="label">A</div><div class="sub">JUMP LEFT</div></div>
    <div id="platB" class="platform" onclick="choose('B')"><div class="icon">🅱️</div><div class="label">B</div><div class="sub">JUMP RIGHT</div></div>
    <div id="char">🧍</div>
    <div id="trapView"><div id="trapIcon">💦</div><div id="trapTitle" style="font-size:22px;font-weight:900;margin:12px 0">YOU FELL!</div><div id="trapDesc" style="font-size:13px;color:#ccc"></div><button class="btn" onclick="restart()">🔁 TRY AGAIN</button></div>
  </div>
  <div id="log"></div>
  <button id="nextBtn" class="btn" style="display:none" onclick="nextLevel()">➡️ NEXT LEVEL <span id="nextL">2</span></button>
</div>

<script>
const LEVELS = [
  { trapIcon:'💦', title:'SPLASH! WATER SLIDE!', desc:'You fell into a water slide!', failVoice:"Oh no!", successVoice:"Yes! You are so lucky!"},
  { trapIcon:'🏔️', title:'FELL INTO THE ABYSS!', desc:'You jumped into a deep canyon.', failVoice:"Nooo! You fell into the abyss!", successVoice:"Amazing! You passed the cliff!"},
  { trapIcon:'🔥', title:'LAVA PIT!', desc:'Over boiling lava.', failVoice:"Ouch! It's so hot!", successVoice:"Wow! You survived the lava!"},
  { trapIcon:'🐊', title:'CROCODILE PIT!', desc:'Pool of hungry crocodiles.', failVoice:"Oh my god! Crocodiles!", successVoice:"Yay! You escaped!"},
  { trapIcon:'⚡', title:'ELECTROCUTED!', desc:'10,000 volt trap!', failVoice:"Ouch! Electric shock!", successVoice:"Great job! You are safe!"},
  { trapIcon:'🕳️', title:'BLACK HOLE!', desc:'Mysterious portal.', failVoice:"Oh no! Black hole!", successVoice:"Incredible! Right portal!"},
  { trapIcon:'❄️', title:'FROZEN TO ICE!', desc:'You froze into ice block.', failVoice:"Brrr! You froze!", successVoice:"Cool! You are still warm!"},
  { trapIcon:'💣', title:'STEPPED ON A MINE!', desc:'BOOM!', failVoice:"Boom! You exploded!", successVoice:"Phew! You dodged the bomb!"},
  { trapIcon:'👑', title:'FINAL BOSS!', desc:'Falling from throne.', failVoice:"No way! Final fail!", successVoice:"Oh my god! You are the luckiest person ever!"},
];

let level=0, answer=[], playerName="Player", synth=window.speechSynthesis, femaleVoice=null;

function loadFemaleVoice(){
  let voices=synth.getVoices();
  femaleVoice = voices.find(v=>v.name.includes('Samantha')) ||
                voices.find(v=>v.name.includes('Google UK English Female')) ||
                voices.find(v=>v.name.includes('Zira')) ||
                voices.find(v=>v.name.toLowerCase().includes('female')) ||
                voices.find(v=>v.lang.startsWith('en')) || voices[0];
}
synth.onvoiceschanged=loadFemaleVoice; loadFemaleVoice();

function speak(text){
  if(!document.getElementById('voiceCheck').checked) return;
  synth.cancel();
  let u=new SpeechSynthesisUtterance(text);
  if(femaleVoice) u.voice=femaleVoice;
  u.pitch=1.4; u.rate=1.02; u.volume=1; u.lang='en-US';
  synth.speak(u);
  document.getElementById('aiText').innerText=text;
}

function previewName(){
  let n=document.getElementById('nameInput').value.trim();
  if(n.length>=2){ document.getElementById('aiText').innerText=`Hi ${n}! Ready to test your luck?`; }
}

function startGame(){
  let input=document.getElementById('nameInput').value.trim();
  if(!input){ alert("Please enter your name first!"); document.getElementById('nameInput').focus(); return; }
  playerName=input;
  
  // HIDE INTRO + START
  document.getElementById('intro').classList.add('hide');
  genAnswer(); initProgress(); renderLevel();
  
  // AI JELASKAN ATURAN PAKAI NAMA
  setTimeout(async()=>{
    await Tone.start();
    let welcomeMsg=`Hi ${playerName}! Welcome to Luck Test! Listen carefully. You will face 9 levels. Each level has two platforms, A and B. Only one is safe, one is a trap. You have 50 50 chance. If you choose wrong, you will fall! If you survive all 9, you are 1 in 512 luckiest person! Now choose A or B, good luck ${playerName}!`;
    document.getElementById('log').innerText=`Welcome ${playerName}! ${welcomeMsg}`;
    speak(welcomeMsg);
  },300);
}

async function playSuccessSound(){ await Tone.start(); let s=new Tone.Synth().toDestination(); s.triggerAttackRelease("C5","0.2"); setTimeout(()=>s.triggerAttackRelease("E5","0.2"),150); setTimeout(()=>s.triggerAttackRelease("G5","0.4"),300); }
async function playFailSound(){ await Tone.start(); let s=new Tone.MembraneSynth().toDestination(); s.triggerAttackRelease("C2","0.8"); }

let progressEl=document.getElementById('progress'), char=document.getElementById('char'), log=document.getElementById('log');
function initProgress(){ progressEl.innerHTML=''; for(let i=0;i<9;i++){let d=document.createElement('div'); d.className='dot'; d.id='dot'+i; d.innerText=i+1; if(i==0) d.classList.add('active'); progressEl.appendChild(d);} }
function genAnswer(){answer=[]; for(let i=0;i<9;i++) answer.push(Math.random()<0.5?'A':'B');}
function renderLevel(){
  document.getElementById('levelInfo').innerText=`${playerName} - LEVEL ${level+1} / 9`;
  document.getElementById('platA').className='platform'; document.getElementById('platB').className='platform';
  char.className=''; char.innerText='🧍'; char.style.bottom='20px'; char.style.left='50%';
  document.getElementById('trapView').classList.remove('show');
  document.getElementById('nextBtn').style.display='none';
  log.innerText=`Level ${level+1}: ${playerName}, choose A or B!`;
  document.querySelectorAll('.dot').forEach((d,i)=>{d.classList.remove('active'); if(i<level) d.classList.add('pass'); if(i==level) d.classList.add('active');});
}
function choose(pick){
  if(document.getElementById('trapView').classList.contains('show')) return;
  let correct=answer[level], isCorrect=pick==correct;
  char.classList.add(pick=='A'?'jumpA':'jumpB'); char.innerText='🦸';
  setTimeout(()=>{
    if(isCorrect){
      document.getElementById('plat'+pick).classList.add('safe');
      document.getElementById('dot'+level).classList.add('pass'); document.getElementById('dot'+level).classList.remove('active');
      char.innerText='😎'; char.style.bottom='100px';
      log.innerHTML=`✅ SAFE! ${playerName}, you chose ${pick} correctly!`;
      playSuccessSound();
      speak(`${LEVELS[level].successVoice} Good job ${playerName}!`);
      if(level==8){
        log.innerHTML=`🎉 INSANE! ${playerName} is 1 in 512 luckiest!`;
        char.innerText='👑';
        setTimeout(()=>{speak(`Oh my god ${playerName}! You are the luckiest person ever! You won all 9 levels!`);},800);
      } else {
        document.getElementById('nextBtn').style.display='inline-block';
        document.getElementById('nextL').innerText=level+2;
      }
    } else {
      document.getElementById('plat'+pick).classList.add('trap');
      document.getElementById('dot'+level).classList.add('fail'); char.classList.add('fall');
      let L=LEVELS[level];
      document.getElementById('trapIcon').innerText=L.trapIcon;
      document.getElementById('trapTitle').innerText=L.title;
      document.getElementById('trapDesc').innerText=`${playerName}, you chose ${pick}, correct was ${correct}. ${L.desc}`;
      document.getElementById('trapView').classList.add('show');
      char.innerText=L.char;
      log.innerHTML=`❌ GAME OVER ${playerName}! Trap at level ${level+1}`;
      playFailSound();
      speak(`${L.failVoice} Sorry ${playerName}, try again!`);
    }
  },600);
}
function nextLevel(){level++; renderLevel(); speak(`Level ${level+1} ${playerName}, choose carefully!`);}
function restart(){level=0; genAnswer(); initProgress(); renderLevel(); speak(`Let's try again ${playerName}! You can do it!`);}
</script>
</body>
</html>
