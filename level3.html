function shuffle(arr){
  let a=[...arr];
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function acakJawaban(soal){
  let list = soal.a.map((txt,i)=>({txt, isBenar: i===soal.k}));
  list = shuffle(list);
  return {q: soal.q, a: list.map(x=>x.txt), k: list.findIndex(x=>x.isBenar)};
}
// FULL RANDOM: acak urutan soal + acak jawaban
const SOAL = shuffle(SOAL_ORIG).map(s=>acakJawaban(s));

let idx=0,benar=0,totalTime=222,sisaTotal=222,timer,salahList=[];
function render(){if(idx>=SOAL.length){end();return;}document.getElementById('noSoal').innerText=`Soal ${idx+1}/74`;document.getElementById('soalText').innerText=`${idx+1}. ${SOAL[idx].q}`;let div=document.getElementById('pilihan');div.innerHTML='';SOAL[idx].a.forEach((t,i)=>{let b=document.createElement('div');b.className='pil';b.innerText=`${String.fromCharCode(65+i)}. ${t}`;b.onclick=()=>jawab(i);div.appendChild(b);});}
function jawab(p){let k=SOAL[idx].k;document.querySelectorAll('.pil').forEach((el,i)=>{el.style.pointerEvents='none';if(i===k)el.classList.add('bener');if(i===p&&i!==k)el.classList.add('salah');});if(p===k){benar++;}else{salahList.push(`${idx+1}. ${SOAL[idx].q} → Jawab: ${SOAL[idx].a[k]}`);}document.getElementById('benar').innerText=`BENAR: ${benar}/74`;setTimeout(()=>{idx++;render();},350);}
function start(){timer=setInterval(()=>{sisaTotal-=0.1;let per=(sisaTotal/totalTime)*100;document.getElementById('timerBar').style.width=per+'%';document.getElementById('totalTimer').innerText=sisaTotal.toFixed(1)+'s';if(sisaTotal<=0)end();},100);}
function lanjutKeLevel4(){if(benar!==74) return;localStorage.setItem('level3_benar', benar);window.location.href='level4.html';}
function end(){
  clearInterval(timer);
  document.getElementById('soalText').innerText='LEVEL 3 SELESAI!';
  document.getElementById('pilihan').innerHTML='';
  let listSalah=salahList.length>0? `<div style="text-align:left;margin-top:15px;background:#FFEBEE;padding:10px;border-radius:10px;font-size:11px;max-height:200px;overflow-y:auto;color:#B71C1C"><b>GAGAL - SALAH ${salahList.length} SOAL:</b><br>${salahList.join('<br>')}</div>` : `<div style="color:#00C853;margin-top:10px;font-size:20px">👑 LEGEND! 74/74 SEMPURNA!</div>`;
