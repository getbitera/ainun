function shuffle(arr){
  let a=[...arr];
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function acakJawaban(soal){
  let list = soal.a.map((txt,i)=>({txt, isBenar: i===soal.k}));
  list = shuffle(list);
  return {q: soal.q, a: list.map(x=>x.txt), k: list.findIndex(x=>x.isBenar)};
}
const SOAL = shuffle(SOAL_ORIG).map(s=>acakJawaban(s));

function jawab(p){let k=SOAL[idx].k;document.querySelectorAll('.pil').forEach((el,i)=>{el.style.pointerEvents='none';if(i===k)el.classList.add('bener');if(i===p&&i!==k)el.classList.add('salah');});if(p===k){benar++;}else{salahList.push(`${idx+1}. ${SOAL[idx].q} → Answer: ${SOAL[idx].a[k]}`);}document.getElementById('benar').innerText=`CORRECT: ${benar}/74`;setTimeout(()=>{idx++;render();},350);}
