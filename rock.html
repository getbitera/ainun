
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Ainun Championship</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;display:flex;justify-content:center;min-height:100vh;font-family:system-ui;color:#fff;overflow:hidden}
#phone{width:100%;max-width:390px;height:100vh;height:100dvh;background:#000;position:relative;overflow:hidden;border-left:1px solid #222;border-right:1px solid #222}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:.35s;z-index:2}
.hidden{opacity:0;pointer-events:none;z-index:1}
#redBox{position:absolute;top:0;left:0;right:0;z-index:40;background:linear-gradient(180deg,#ff2a2a,#a80000);border-bottom:4px solid #fff;display:flex;justify-content:space-between;padding:10px 14px}
#redBox .left{font-size:28px;font-weight:900;line-height:1} #redBox .left small{display:block;font-size:10px;opacity:.9}
#redBox .right{text-align:right} #redBox .right .time{font-size:22px;font-weight:900;color:#ffe500;line-height:1} #redBox .right small{font-size:9px;opacity:.8}
#splash{background:#000;justify-content:flex-end}
#splash .bgImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#splash .overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,.1) 0%, rgba(0,0,0,.7) 60%);z-index:1}
.splashBottom{position:relative;z-index:2;padding:20px;width:100%;margin-bottom:20px}
.btnStart{width:100%;padding:18px;border-radius:100px;border:0;background:#fff;color:#000;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.6)}
#nameScreen{background:radial-gradient(ellipse at 50% 0%, #1c2040, #000);justify-content:center;padding:60px 16px 16px}
.nameCard{background:rgba(20,22,40,.95);border:2px solid rgba(255,255,255,.15);border-radius:22px;padding:18px;width:100%;text-align:center}
input{width:100%;padding:13px 16px;border-radius:100px;border:2px solid #33385a;background:#0f1220;color:#fff;margin:12px 0;outline:none;font-size:15px}
.avatars{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.av{width:46px;height:46px;border-radius:50%;background:#222746;border:2px solid #3a3f65;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.av.sel{border-color:#00e5cc;transform:scale(1.15);background:#00e5cc33}
.btnGo{width:100%;padding:14px;border-radius:100px;border:0;background:#00e5cc;color:#000;font-weight:900;font-size:15px;cursor:pointer;margin-top:8px}
.btnGo:disabled{opacity:.4}
.board{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px;margin-top:10px;font-size:10px;text-align:left}
#game{background:#0a0c14;padding-top:62px}
.topbar{display:flex;justify-content:space-between;padding:8px 10px;background:#11142a;border-bottom:1px solid #222746;font-size:10px;font-weight:800}
.badge{background:#00e5cc;color:#000;padding:2px 8px;border-radius:100px}
.progress{height:5px;background:#222746;display:flex} .progress div{height:100%;background:#00e5cc;transition:.3s}
.ring-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(ellipse at 50% 0%,#1c2040,#0a0c14)}
.ring{width:100%;height:340px;background:linear-gradient(180deg,#f5e6c8,#e8d5a3);border:4px solid #fff;border-radius:18px;position:relative;box-shadow:0 0 0 4px #ff3b3b,0 0 0 8px #fff;display:flex;flex-direction:column}
.ropes{position:absolute;left:-4px;right:-4px;top:24%;height:3px;background:#ff3b3b;box-shadow:0 42px 0 #ff3b3b,0 84px 0 #ff3b3b,0 126px 0 #ff3b3b}
.ref{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#11142a;border:2px solid #fff;border-radius:100px;padding:0 8px;font-size:20px}
.fighters{display:flex;flex:1;justify-content:space-around;align-items:center;z-index:1}
.f-avatar{width:70px;height:70px;background:#11142a;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:34px;transition:.2s}
.f-avatar.punch{transform:scale(1.2)} .choice{width:62px;height:62px;background:#11142a;border:3px solid #fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;margin:6px auto 0}
.nameTag{font-size:9px;font-weight:900;background:#fff;color:#000;padding:2px 8px;border-radius:100px}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#11142a;border:2px solid #fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#00e5cc;font-weight:900;z-index:2}
#ann{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);border:2px solid #00e5cc;color:#00e5cc;padding:8px 14px;border-radius:100px;font-weight:900;font-size:13px;opacity:0;transition:.3s;z-index:5;white-space:nowrap}
#ann.show{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
.controls{display:flex;gap:6px;padding:10px;background:#11142a;border-top:1px solid #222746}
.cBtn{flex:1;background:#1e223a;border:2px solid #3a3f65;border-radius:12px;padding:8px 4px;font-size:26px;text-align:center;cursor:pointer}
.cBtn b{display:block;font-size:8px}

/* RESULT & INTERMISSION */
#result, #intermission{position:absolute;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;transition:.4s}
#result.hidden, #intermission.hidden{opacity:0;pointer-events:none}
.resCard{background:linear-gradient(180deg,#1e223a,#11142a);border:2px solid #fff;border-radius:24px;padding:24px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.resCard .bigScore{font-size:54px;font-weight:900;color:#ffd700;margin:12px 0;line-height:1}
.countNum{font-size:90px;font-weight:900;color:#fff;line-height:1;animation:pop .6s}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="phone">
<div id="redBox"><div class="left"><small>CHAMPIONSHIP SCORE</small><span id="scoreBig">0 - 0</span></div><div class="right"><div class="time" id="timer">00.0s</div><small>TOP: <b id="topRec">--</b> • <span id="rInfo">R1/3</span></small></div></div>

<div id="splash" class="screen">
  <img class="bgImg" src="screengambarscisor.jpg" alt="">
  <div class="overlay"></div>
  <div class="splashBottom"><button class="btnStart" onclick="goName()">▶ START GAME</button></div>
</div>

<div id="nameScreen" class="screen hidden">
  <div class="nameCard">
    <h2>ENTER <span style="color:#00e5cc">FIGHTER</span> NAME</h2>
    <input id="nameInput" placeholder="Your Name...">
    <div style="font-size:10px;font-weight:800">CHOOSE AVATAR</div>
    <div class="avatars" id="avList"></div>
    <div class="board"><h4 style="text-align:center;color:#ffd700;font-size:10px">🏆 TOP 3 FASTEST</h4><div id="board">No record yet</div></div>
    <button class="btnGo" id="goBtn" disabled onclick="startTour()">FIGHT NOW 🔔</button>
    <button style="width:100%;background:transparent;color:#fff;border:1px solid #333;border-radius:100px;margin-top:8px;padding:10px;font-size:12px" onclick="goSplash()">← Back</button>
  </div>
</div>

<div id="game" class="screen hidden">
  <div class="topbar"><span id="p1">FIGHTER</span><span class="badge" id="badge">ROUND 1 - BO3</span><span id="scoreMini">YOU 0-0 AI</span></div>
  <div class="progress"><div id="prog" style="width:0%"></div></div>
  <div class="ring-wrap"><div class="ring"><div class="ropes"></div><div class="ref">🧑‍⚖️</div><div class="fighters"><div style="text-align:center"><div class="f-avatar" id="av1">😎</div><div class="nameTag" id="n1">YOU</div><div class="choice" id="b1">?</div></div><div class="vs" id="vs">VS</div><div style="text-align:center"><div class="f-avatar" id="av2">🤖</div><div class="nameTag">AI</div><div class="choice" id="b2">?</div></div></div><div id="ann">FIGHT!</div></div></div>
  <div class="controls"><div class="cBtn" onclick="play('scissor')">✌️<b>SCISSOR</b></div><div class="cBtn" onclick="play('rock')">✊<b>ROCK</b></div><div class="cBtn" onclick="play('paper')">✋<b>PAPER</b></div></div>
</div>

<!-- INTERMISSION: PENGUMUMAN RONDE + COUNTDOWN 3 2 1 -->
<div id="intermission" class="hidden">
  <div class="resCard">
    <div id="interEmoji" style="font-size:48px">🏆</div>
    <h1 id="interTitle" style="font-size:24px">ROUND 1 WINNER!</h1>
    <div class="bigScore" id="interScore">YOU WIN 2-0</div>
    <div id="interDetail" style="font-size:12px;opacity:.8">Next round starting in...</div>
    <div class="countNum" id="countNum">3</div>
  </div>
</div>

<!-- FINAL RESULT -->
<div id="result" class="hidden">
  <div class="resCard">
    <div id="resEmoji" style="font-size:48px">🏆</div>
    <h1 id="resTitle">CHAMPION!</h1>
    <div class="bigScore" id="resScore">2 - 1<small style="font-size:14px;color:#fff;display:block">WIN IN 15.2s</small></div>
    <div id="resMsg" style="font-size:12px;opacity:.8;margin:10px 0">Incredible!</div>
    <button class="btnStart" style="font-size:14px;padding:12px;margin-top:12px" onclick="closeResult()">PLAY AGAIN 🔄</button>
  </div>
</div>

</div>

<script>
const avatars=['😎','🔥','👑','⚡','🥷','🦁','🐯','👊','💀','🤠'];
let selAv=avatars[0], playerName='', round=1, roundWins=[0,0], cur={p:0,ai:0}, startTime=0, tInt=null;
let records=JSON.parse(localStorage.getItem('ainun_records')||'[]');
const icon={scissor:'✌️',rock:'✊',paper:'✋'};
const ac=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d,t='sine',v=.5){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type=t;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ac.currentTime+d);o.start();o.stop(ac.currentTime+d);}
function bell(){beep(800,.5,'sine',.8);setTimeout(()=>beep(1200,.7,'sine',.8),200);}
function clap(){for(let i=0;i<14;i++)setTimeout(()=>beep(900+Math.random()*1200,.12,'square',.32),i*80);}
function cheer(){for(let i=0;i<20;i++)setTimeout(()=>beep(400+Math.random()*700,.25,'sine',.22),i*60);}
function boo(){beep(150,.8,'sawtooth',.45);}
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=1.05;speechSynthesis.speak(u);}
const avList=document.getElementById('avList');
avatars.forEach((a,i)=>{let d=document.createElement('div');d.className='av'+(i==0?' sel':'');d.innerText=a;d.onclick=()=>{document.querySelectorAll('.av').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');selAv=a;};avList.appendChild(d);});
document.getElementById('nameInput').addEventListener('input',()=>{playerName=document.getElementById('nameInput').value.trim();document.getElementById('goBtn').disabled=playerName.length<2;});
function renderBoard(){if(records.length==0){document.getElementById('board').innerHTML='No record - Be first!';document.getElementById('topRec').innerText='--';return;}records.sort((a,b)=>a.time-b.time);document.getElementById('topRec').innerText=`${records[0].name} ${records[0].time.toFixed(1)}s`;document.getElementById('board').innerHTML=records.slice(0,3).map((r,i)=>`${i==0?'🥇':i==1?'🥈':'🥉'} ${r.name} ${r.time.toFixed(1)}s`).join('<br>');}
renderBoard();
function goSplash(){document.getElementById('nameScreen').classList.add('hidden');document.getElementById('splash').classList.remove('hidden');}
function goName(){ac.resume();document.getElementById('splash').classList.add('hidden');document.getElementById('nameScreen').classList.remove('hidden');bell();}
function showAnn(t,c='#00e5cc'){let el=document.getElementById('ann');el.innerText=t;el.style.color=c;el.style.borderColor=c;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1200);}

function startTour(){round=1;roundWins=[0,0];startMatch();document.getElementById('nameScreen').classList.add('hidden');document.getElementById('game').classList.remove('hidden');document.getElementById('n1').innerText=playerName.toUpperCase();document.getElementById('p1').innerText=playerName.toUpperCase();document.getElementById('av1').innerText=selAv;startTime=Date.now();tInt=setInterval(()=>{document.getElementById('timer').innerText=((Date.now()-startTime)/1000).toFixed(1)+'s';},100);bell();cheer();showAnn(`ROUND 1!`,'#ffd700');speak(`Round one, best of three!`);}
function startMatch(){cur={p:0,ai:0};let need=round==1?2:round==2?3:4;document.getElementById('badge').innerText=round==1?'ROUND 1 - BO3':round==2?'ROUND 2 - BO5':'FINAL - BO7';document.getElementById('rInfo').innerText=`R${round}/3`;document.getElementById('vs').innerText=`${need}W`;updateScore();}
function updateScore(){document.getElementById('scoreBig').innerText=`${cur.p} - ${cur.ai}`;document.getElementById('scoreMini').innerText=`YOU ${cur.p}-${cur.ai} AI`;let need=round==1?2:round==2?3:4;document.getElementById('prog').style.width=(Math.max(cur.p,cur.ai)/need*100)+'%';}

function play(p){
  let ops=['scissor','rock','paper'];let pKom=ops[Math.floor(Math.random()*3)];
  document.getElementById('b1').innerText=icon[p];document.getElementById('b2').innerText=icon[pKom];
  let av1=document.getElementById('av1'),av2=document.getElementById('av2');av1.classList.add('punch');av2.classList.add('punch');setTimeout(()=>{av1.classList.remove('punch');av2.classList.remove('punch');},250);
  let win=null;if(p!=pKom){if((p=='scissor'&&pKom=='paper')||(p=='rock'&&pKom=='scissor')||(p=='paper'&&pKom=='rock'))win='p';else win='ai';}
  if(win=='p'){cur.p++;clap();showAnn('YOU WIN!','#00e5cc');}else if(win=='ai'){cur.ai++;boo();showAnn('AI WINS!','#ff5a6a');}else showAnn('DRAW!','#aaa');
  updateScore();
  let need=round==1?2:round==2?3:4;
  if(cur.p>=need||cur.ai>=need){
    let winner = cur.p>cur.ai ? playerName.toUpperCase() : 'AI';
    let scoreText = `${cur.p}-${cur.ai}`;
    // Tampilkan intermission dulu kalau bukan final
    if(round==1 || (round==2 && roundWins[0]+roundWins[1]==0)){
      // untuk round 1 dan awal round 2, simpan dulu
      if(cur.p>cur.ai) roundWins[0]++; else roundWins[1]++;
      if(round==1){
        showIntermission(winner, `ROUND 1 WINNER!`, `SCORE ${scoreText}`, ()=>{ round=2; startMatch(); bell(); cheer(); showAnn('ROUND 2 START!','#ffd700'); speak('Round two, best of five!'); });
      } else { // round 2 selesai tapi masih 1-1 atau 2-0
        if(roundWins[0]==2) finish(true);
        else if(roundWins[1]==2) finish(false);
        else {
          // 1-1 -> final
          showIntermission('DRAW 1-1!', `GO TO FINAL!`, `SCORE ${roundWins[0]}-${roundWins[1]}`, ()=>{ round=3; startMatch(); bell(); cheer(); showAnn('FINAL ROUND!','#ffd700'); speak('Final round, best of seven!'); });
        }
      }
    } else if(round==2){
      if(cur.p>cur.ai) roundWins[0]++; else roundWins[1]++;
      if(roundWins[0]==2) finish(true);
      else if(roundWins[1]==2) finish(false);
      else {
        showIntermission('DRAW 1-1!', `FINAL ROUND!`, `${roundWins[0]}-${roundWins[1]}`, ()=>{ round=3; startMatch(); bell(); cheer(); });
      }
    } else {
      // final round 3
      if(cur.p>cur.ai) roundWins[0]++; else roundWins[1]++;
      finish(roundWins[0]>roundWins[1]);
    }
  }
}

function showIntermission(winner, title, score, callback){
  let inter=document.getElementById('intermission');
  document.getElementById('interEmoji').innerText = winner.includes('AI')?'🤖':'🏆';
  document.getElementById('interTitle').innerText = title;
  document.getElementById('interScore').innerText = `${winner} WIN ${score}`;
  document.getElementById('interDetail').innerText = 'Next round in...';
  inter.classList.remove('hidden');
  bell(); speak(`${winner} wins this round!`);
  
  let count=3;
  document.getElementById('countNum').innerText=count;
  let cInt=setInterval(()=>{
    count--;
    if(count>0){
      document.getElementById('countNum').innerText=count;
      beep(600+count*100,.3,'sine',.6);
    } else if(count==0){
      document.getElementById('countNum').innerText='FIGHT!';
      beep(1000,.6,'sine',.8);
    } else {
      clearInterval(cInt);
      inter.classList.add('hidden');
      callback();
    }
  },900);
}

function finish(isChamp){
  clearInterval(tInt);let time=(Date.now()-startTime)/1000;bell();
  let res=document.getElementById('result');
  document.getElementById('resScore').innerHTML=`${roundWins[0]} - ${roundWins[1]}<small style="font-size:14px;color:#fff;display:block">${isChamp?'WIN':'LOSE'} IN ${time.toFixed(1)}s</small>`;
  if(isChamp){
    document.getElementById('resEmoji').innerText='🏆';
    document.getElementById('resTitle').innerText=`CHAMPION ${playerName.toUpperCase()}!`;
    document.getElementById('resMsg').innerText=`Amazing! You win ${roundWins[0]}-${roundWins[1]} in ${time.toFixed(1)}s!`;
    clap();cheer();speak(`Champion ${playerName} wins ${roundWins[0]} to ${roundWins[1]} in ${time.toFixed(1)} seconds!`);
    records.push({name:playerName,time:time,rounds:round,date:Date.now()});records.sort((a,b)=>a.time-b.time);records=records.slice(0,10);localStorage.setItem('ainun_records',JSON.stringify(records));renderBoard();
  } else {
    document.getElementById('resEmoji').innerText='😭';
    document.getElementById('resTitle').innerText=`YOU LOSE!`;
    document.getElementById('resMsg').innerText=`AI wins ${roundWins[1]}-${roundWins[0]}. Try again!`;
    speak(`You lose!`);
  }
  res.classList.remove('hidden');
}
function closeResult(){document.getElementById('result').classList.add('hidden');document.getElementById('game').classList.add('hidden');document.getElementById('splash').classList.remove('hidden');document.getElementById('timer').innerText='00.0s';document.getElementById('scoreBig').innerText='0 - 0';}
</script>
</body>
</html>
