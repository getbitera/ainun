function shuffle(arr){
  let a=[...arr];
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function acakJawaban(soal){
  let list = soal.a.map((txt,i)=>({txt, isBenar: i===soal.k}));
  list = shuffle(list);
  return {q: soal.q, a: list.map(x=>x.txt), k: list.findIndex(x=>x.isBenar)};
}
const SOAL = shuffle(SOAL_ORIG).map(s=>acakJawaban(s));

let idx=0,benar=0,totalTime=888,sisaTotal=888,timer,salahList=[];
function render(){if(idx>=SOAL.length){end();return;}document.getElementById('noSoal').innerText=`Soal ${idx+1}/296`;document.getElementById('soalText').innerText=`${idx+1}. ${SOAL[idx].q}`;let div=document.getElementById('pilihan');div.innerHTML='';SOAL[idx].a.forEach((t,i)=>{let b=document.createElement('div');b.className='pil';b.innerText=`${String.fromCharCode(65+i)}. ${t}`;b.onclick=()=>jawab(i);div.appendChild(b);});}
function jawab(p){let k=SOAL[idx].k;document.querySelectorAll('.pil').forEach((el,i)=>{el.style.pointerEvents='none';if(i===k)el.classList.add('bener');if(i===p&&i!==k)el.classList.add('salah');});if(p===k){benar++;}else{salahList.push(`${idx+1}. ${SOAL[idx].q} → Jawab: ${SOAL[idx].a[k]}`);}document.getElementById('benar').innerText=`BENAR: ${benar}/296`;setTimeout(()=>{idx++;render();},350);}
function start(){timer=setInterval(()=>{sisaTotal-=0.1;let per=(sisaTotal/totalTime)*100;document.getElementById('timerBar').style.width=per+'%';document.getElementById('totalTimer').innerText=sisaTotal.toFixed(1)+'s';if(sisaTotal<=0)end();},100);}
function lanjutKeLevel6(){if(benar!==296) return;localStorage.setItem('level5_benar', benar);window.location.href='level6.html';}
function end(){
  clearInterval(timer);
  document.getElementById('soalText').innerText='LEVEL 5 SELESAI!';
  document.getElementById('pilihan').innerHTML='';
  let listSalah=salahList.length>0? `<div style="text-align:left;margin-top:15px;background:#FFEBEE;padding:10px;border-radius:10px;font-size:11px;max-height:200px;overflow-y:auto;color:#B71C1C"><b>GAGAL - SALAH ${salahList.length} SOAL:</b><br>${salahList.join('<br>')}</div>` : `<div style="color:#00C853;margin-top:10px;font-size:20px">👑 LEGEND! 296/296 SEMPURNA!</div>`;
  let l1=localStorage.getItem('level1_benar')||0;
  let l2=localStorage.getItem('level2_benar')||0;
  let l3=localStorage.getItem('level3_benar')||0;
  let l4=localStorage.getItem('level4_benar')||0;
  document.getElementById('hasil').innerHTML=`<div style="font-size:22px">BENAR: ${benar} dari 296</div><div style="font-size:13px;color:#555">${benar===296? '100%! Lo layak ke Level 6!' : 'Wajib 100% (296/296) untuk lanjut! Soal akan acak lagi kalau ulangi!'}<br>Total: L1 ${l1}/16 | L2 ${l2}/32 | L3 ${l3}/74 | L4 ${l4} | L5 ${benar}/296<br>Waktu sisa: ${sisaTotal.toFixed(1)}s</div>${listSalah}`;
  document.getElementById('btnUlang').style.display='block';
  if(benar===296){document.getElementById('btnNext').style.display='block';}
}
render();start();
</script>
