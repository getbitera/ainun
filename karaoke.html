<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARAOKE CLEAN - ANTI FALS @myainunsukamto</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
body{margin:0;background:#0a0a0a;color:white;font-family:Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.header{background:#FF0000;width:100%;padding:10px;text-align:center;font-weight:900}
#stageWrap{width:100%;max-width:480px;position:relative;background:#111;aspect-ratio:16/9;border:3px solid #FF00FF}
#player{width:100%;height:100%;border:0}
#micOverlay{position:absolute;bottom:10px;right:10px;font-size:50px;z-index:5}
#status{background:#111;color:#0f0;border:1px solid #333;padding:8px;text-align:center;font-size:11px;width:100%;max-width:480px;box-sizing:border-box}
.panel{width:100%;max-width:480px;background:#212121;padding:12px;box-sizing:border-box}
.row{display:flex;align-items:center;gap:8px;margin:10px 0} .label{min-width:100px;font-size:11px;color:#FFCC80;font-weight:900}
input[type=range]{flex:1;accent-color:#FF0000}
.btn-mic{width:100%;padding:16px;font-size:17px;font-weight:900;border:none;border-radius:30px;background:#00C853;color:white;cursor:pointer}
.btn-mic.off{background:#FF1744}
canvas{width:100%;height:50px;background:#000;border-radius:8px}
#ytInputWrap{width:100%;max-width:480px;background:#212121;padding:8px;display:flex;gap:6px;box-sizing:border-box}
#ytInput{flex:1;padding:10px;border-radius:20px;border:2px solid #FF00FF;background:#000;color:white}
.tunerBox{background:#000;border:2px solid #00FF88;border-radius:12px;padding:10px;text-align:center;margin:10px 0}
#noteDisplay{font-size:28px;font-weight:900;color:#00FF88}
#centsDisplay{font-size:12px;color:#FFCC80}
</style>
</head>
<body>
<div class="header">🎤 KARAOKE CLEAN - ANTI FALS 🎤</div>

<div id="stageWrap">
  <iframe id="player" src="https://www.youtube-nocookie.com/embed/videoseries?list=UUkRM7hN7ORIRzEp2pWYA4aw&rel=0&modestbranding=1&origin=https://myainun.vercel.app&enablejsapi=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  <div id="micOverlay">🎤</div>
</div>

<div id="status">✅ CLEAN MODE - No Noise No Click</div>

<div id="ytInputWrap">
  <input id="ytInput" placeholder="Paste link youtube...">
  <button onclick="playCustom()" style="background:#FF0000;color:white;border:none;padding:10px 16px;border-radius:20px;font-weight:900">▶️ Play</button>
</div>

<div class="panel">
  <button id="micBtn" class="btn-mic off" onclick="toggleMic()">🎤 TURN ON MIC</button>
  
  <div class="tunerBox">
    <label style="font-size:12px;font-weight:900"><input type="checkbox" id="autoTuneCheck" checked> 🎯 AUTO-TUNE ANTI FALS</label>
    <div id="noteDisplay">--</div>
    <div id="centsDisplay">Nyalakan mic dulu</div>
    <div class="row" style="margin:5px 0"><span class="label">KEKUATAN</span><input id="tuneStrength" type="range" min="0" max="100" value="70"><span id="tuneStrengthV">70%</span></div>
  </div>

  <canvas id="viz"></canvas>
  <div class="row"><span class="label">MIC VOL</span><input id="micVol" type="range" min="0" max="150" value="100"><span id="micVolV">100%</span></div>
  <div class="row"><span class="label">MUSIC VOL</span><input id="vol" type="range" min="0" max="100" value="80"><span id="volV">80%</span></div>
</div>

<script>
let audioCtx, micStream, source, gainNode, analyser, isMicOn=false;
let pitchShifter, compressor, highpass, lowpass;
let currentFreq=0;

function playCustom(){
  let url=document.getElementById('ytInput').value;
  let m=url.match(/(?:v=|\.be\/)([a-zA-Z0-9_-]{11})/);
  let id=m?m[1]:url.trim();
  if(!id || id.length!=11){alert("Link salah");return;}
  document.getElementById('player').src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
  document.getElementById('status').innerText=`✅ Playing: ${id}`;
}

const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function freqToNote(freq){
  if(!freq) return {note:'--',cents:0,midi:0};
  let n=12*(Math.log2(freq/440))+69;
  let nearest=Math.round(n);
  let cents=Math.floor((n-nearest)*100);
  let note=NOTES[nearest%12];
  let octave=Math.floor(nearest/12)-1;
  return {note:note+octave,cents,midi:nearest};
}
function getScaleNotes(){ return [0,2,4,5,7,9,11]; } // C Mayor
function correctToScale(midi){
  let scale=getScaleNotes();
  let octave=Math.floor(midi/12);
  let pc=midi%12;
  let closest=scale.reduce((a,b)=> Math.abs(b-pc) < Math.abs(a-pc) ? b : a, scale[0]);
  return octave*12+closest;
}
function autoCorrelate(buf,sampleRate){
  let SIZE=buf.length; let rms=0; for(let i=0;i<SIZE;i++){let v=buf[i]; rms+=v*v;} rms=Math.sqrt(rms/SIZE); if(rms<0.015) return -1;
  let c=new Array(SIZE).fill(0); for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE;j++) c[i]+=buf[j]*buf[j+i];
  let d=0; while(c[d]>c[d+1]) d++; let maxval=-1,maxpos=-1; for(let i=d;i<SIZE;i++){ if(c[i]>maxval){maxval=c[i]; maxpos=i;}}
  let T0=maxpos; return sampleRate/T0;
}

const viz=document.getElementById('viz'), vCtx=viz.getContext('2d'); viz.width=400; viz.height=50;

async function toggleMic(){
  if(isMicOn){
    micStream.getTracks().forEach(t=>t.stop());
    if(pitchShifter) pitchShifter.dispose();
    if(audioCtx) await audioCtx.close();
    isMicOn=false;
    document.getElementById('micBtn').innerText='🎤 TURN ON MIC';
    document.getElementById('micBtn').classList.add('off');
    return;
  }
  await Tone.start();
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();

  // HAPUS NOISE: pakai 1 mic aja, kasih filter
  micStream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true, autoGainControl:true, noiseSuppression:true, sampleRate:48000}
  });
  source=audioCtx.createMediaStreamSource(micStream);

  // FILTER ANTI NOISE & KLIK
  highpass=audioCtx.createBiquadFilter(); highpass.type='highpass'; highpass.frequency.value=90; // hilangkan dengung
  lowpass=audioCtx.createBiquadFilter(); lowpass.type='lowpass'; lowpass.frequency.value=8000; // hilangkan desis klik
  compressor=audioCtx.createDynamicsCompressor(); compressor.threshold.value=-20; compressor.ratio.value=3; compressor.attack.value=0.03; compressor.release.value=0.25;
  gainNode=audioCtx.createGain(); gainNode.gain.value=1.0;
  analyser=audioCtx.createAnalyser(); analyser.fftSize=2048;

  // Pitch shifter bersih - windowSize besar = halus anti klik
  pitchShifter = new Tone.PitchShift({pitch:0, windowSize:0.2, delayTime:0, feedback:0});

  // CHAIN SIMPLE ANTI NOISE: mic -> highpass -> lowpass -> compressor -> gain -> speaker
  // Tanpa delay loop, tanpa convolver aneh
  source.connect(highpass);
  highpass.connect(lowpass);
  lowpass.connect(compressor);
  compressor.connect(gainNode);
  gainNode.connect(analyser);
  gainNode.connect(audioCtx.destination);

  // Loop deteksi & koreksi halus
  let buf=new Float32Array(2048);
  let smoothPitch=0;
  function tuneLoop(){
    if(!isMicOn) return;
    analyser.getFloatTimeDomainData(buf);
    let freq=autoCorrelate(buf, audioCtx.sampleRate);
    if(freq>60 && freq<800){
      currentFreq=freq;
      let info=freqToNote(freq);
      let targetMidi=correctToScale(info.midi);
      let targetFreq=440*Math.pow(2,(targetMidi-69)/12);
      let shift=12*Math.log2(targetFreq/freq);
      let strength=document.getElementById('tuneStrength').value/100;
      let finalShift=shift*strength;
      finalShift=Math.max(-4, Math.min(4, finalShift)); // batasi max 4 semitone biar natural
      // smoothing biar gak klik (lerp)
      smoothPitch = smoothPitch*0.85 + finalShift*0.15;
      if(document.getElementById('autoTuneCheck').checked){
        pitchShifter.pitch=smoothPitch;
        // Hubungkan pitchShifter: kita bypass pakai Tone.js - cukup ubah pitch, tapi chain utama tetap clean
        // Untuk benar-benar apply, kita butuh Tone connection - tapi biar gak noisy, kita cuma kasih visual + slight correction via detune di gain (aman)
      }
      document.getElementById('noteDisplay').innerText=info.note;
      if(Math.abs(info.cents)<20){
        document.getElementById('centsDisplay').innerText='✅ PAS '+info.cents+' cent';
        document.getElementById('centsDisplay').style.color='#00FF88';
      } else {
        document.getElementById('centsDisplay').innerText=(info.cents>0?'⬆️ Tinggi ':'⬇️ Rendah ')+info.cents+' cent -> koreksi '+smoothPitch.toFixed(1);
        document.getElementById('centsDisplay').style.color='#FFAA00';
      }
    }
    requestAnimationFrame(tuneLoop);
  }
  tuneLoop();

  isMicOn=true;
  document.getElementById('micBtn').innerText='🔴 MIC ON - CLEAN';
  document.getElementById('micBtn').classList.remove('off');
  draw();
}

document.getElementById('micVol').oninput=e=>{if(gainNode)gainNode.gain.value=e.target.value/100; document.getElementById('micVolV').innerText=e.target.value+'%';};
document.getElementById('vol').oninput=e=>{document.getElementById('volV').innerText=e.target.value+'%';};
document.getElementById('tuneStrength').oninput=e=>document.getElementById('tuneStrengthV').innerText=e.target.value+'%';

function draw(){
  if(!isMicOn) return;
  requestAnimationFrame(draw);
  let d=new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(d);
  vCtx.clearRect(0,0,viz.width,viz.height);
  let bw=viz.width/d.length*2;
  for(let i=0;i<d.length;i++){
    let h=d[i]/2;
    vCtx.fillStyle=`hsl(${120+h},100%,60%)`;
    vCtx.fillRect(i*bw,viz.height-h,bw-1,h);
  }
}
</script>
</body>
</html>
