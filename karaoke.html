<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFFICIAL - @myainunvercel</title>
<style>
body{margin:0;background:#000;color:white;font-family:Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh}
#stageWrap{width:100%;max-width:480px;position:relative;background:#111;aspect-ratio:16/9;border:2px solid #FF00FF;display:flex;align-items:center;justify-content:center}
#player{width:100%;height:100%}
#status{width:100%;max-width:480px;background:#000;color:#0f0;text-align:center;padding:8px;font-size:12px;border:1px solid #FF00FF}
</style>
</head>
<body>
<div id="stageWrap"><div id="player"></div></div>
<div id="status">🔒 LOCKED to UCkRM7hN7ORIRzEp2pWYA4aw (@myainunvercel) - Paste your own video below</div>
<div style="width:100%;max-width:480px;padding:8px;display:flex;gap:6px;background:#212121">
<input id="ytInput" style="flex:1;padding:10px;border-radius:20px;background:#000;color:white;border:2px solid #FF0000" placeholder="Paste YOUR video link, ex: https://youtu.be/xxxx">
<button onclick="loadYT()" style="background:#FF0000;color:white;border:none;padding:10px 16px;border-radius:20px;font-weight:900">▶️ Play</button>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const MY_CHANNEL_ID = "UCkRM7hN7ORIRzEp2pWYA4aw";
const MY_HANDLE = "@myainunvercel";
// ISI DENGAN VIDEO ID MILIKMU - contoh cara ambil ID ada di bawah
let MY_SONGS = []; // kosongkan dulu, nanti auto terisi pas kamu paste

let ytPlayer;
function onYouTubeIframeAPIReady(){
  ytPlayer = new YT.Player('player',{height:'100%',width:'100%',videoId:'',playerVars:{playsinline:1}});
}
function parseId(url){
  let m=url.match(/(?:v=|\.be\/)([a-zA-Z0-9_-]{11})/);
  return m?m[1]:null;
}
function loadYT(){
  let url=document.getElementById('ytInput').value;
  let id=parseId(url);
  if(!id){ alert("Link salah! Contoh benar: https://youtu.be/ABC123xyz12"); return; }
  
  // SIMPAN KE LIST MILIKMU
  if(!MY_SONGS.includes(id)) MY_SONGS.push(id);
  
  document.getElementById('status').innerHTML = `✅ Playing YOUR song: ${id} | Total your songs: ${MY_SONGS.length} | Channel locked: ${MY_HANDLE}`;
  document.getElementById('status').style.color="#0f0";
  ytPlayer.loadVideoById(id);
  
  // Tampilkan ID biar bisa kamu copy ke kode permanen
  console.log("Tambahkan ini ke MY_SONGS: ", JSON.stringify(MY_SONGS));
}
</script>
</body>
</html>
