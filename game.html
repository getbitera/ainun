
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Ainun - Level 1</title>
<style>
body{margin:0;background:#f5f1e8;display:flex;justify-content:center;min-height:100vh;font-family:sans-serif}
.museum{width:100%;max-width:900px;background:radial-gradient(ellipse at center,#fdfbf5 0%,#e8e0cc 100%);border-left:24px solid #2b2117;border-right:24px solid #2b2117;padding:40px 20px 80px}
h1{font-family:serif;text-align:center;font-size:42px;letter-spacing:0.12em;margin:0}
.sub{text-align:center;opacity:0.5;letter-spacing:0.2em;font-size:13px;margin:6px 0 30px}
.frame{background:#111;padding:12px;border:10px solid #1a1a1a;max-width:700px;margin:0 auto}
.frame img{width:100%;display:block}
.plaque{background:#f9f6ef;border:1px solid #d6c7a8;padding:20px;margin:50px auto 0;max-width:700px}
label{display:block;font-family:serif;font-size:18px;margin:18px 0 8px;font-weight:600}
textarea,input{width:100%;border:1px solid #c9b896;background:#fffefb;padding:12px;box-sizing:border-box;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{width:calc(20% - 7px);min-width:75px;text-align:center}
.btn{display:block;margin:30px auto 0;background:#1a1a1a;color:#e8e0cc;border:none;padding:14px 40px;letter-spacing:0.2em;cursor:pointer;transition:.2s}
.btn:hover{background:#000}
.btn2{display:none;margin:16px auto 0;background:#2b2117;color:#e8e0cc;border:none;padding:14px 36px;letter-spacing:0.15em;cursor:pointer;animation:fadeIn .5s ease}
.btn2:hover{background:#000}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#out{display:none;text-align:center;margin-top:30px;border-top:1px dashed #c9a96e;padding-top:20px}
.note{text-align:center;font-size:11px;opacity:0.4;margin-top:24px}
</style>
</head>
<body>
<div class="museum">
<h1>MY AINUN</h1>
<div class="sub">LEVEL 1 - MUSEUM</div>
<div class="frame"><img src="level1.jpg" alt="Statue House"></div>
<div class="plaque">
<label>1. Tell your story freely, without limits:</label>
<textarea id="story" rows="5" placeholder="Write your story here..."></textarea>
<label>2. Summarize into 1-5 adjectives:</label>
<div class="row">
<input id="a1" placeholder="1"><input id="a2" placeholder="2"><input id="a3" placeholder="3"><input id="a4" placeholder="4"><input id="a5" placeholder="5">
</div>
<button class="btn" onclick="go()">DONE</button>
<button class="btn2" id="nextBtn" onclick="goToLevel2()">CONTINUE TO LEVEL 2 →</button>
<div id="out"></div>
<div class="note">just for entertainment - done, delete, pass - heheheheh</div>
</div>
</div>
<script>
// Load if already exists
window.onload = () => {
  const saved = JSON.parse(localStorage.getItem('myainun_level1') || 'null');
  if(saved){
    document.getElementById('story').value = saved.story || '';
    if(saved.adjectives){
      saved.adjectives.forEach((v,i)=>{
        const el = document.getElementById('a'+(i+1));
        if(el) el.value = v;
      });
    }
  }
}

function go(){
  const s=document.getElementById('story').value.trim();
  const ad=[1,2,3,4,5].map(i=>document.getElementById('a'+i).value.trim()).filter(Boolean);
  const out=document.getElementById('out');
  const next=document.getElementById('nextBtn');

  if(!s){alert('Write your story first');return}
  if(!ad.length){alert('Fill at least 1 adjective');return}

  // SAVE TO LOCAL STORAGE FOR CONTINUITY
  const data = {
    story: s,
    adjectives: ad,
    timestamp: new Date().toISOString(),
    level: 1
  };
  localStorage.setItem('myainun_level1', JSON.stringify(data));
  // Also set global progress
  localStorage.setItem('myainun_currentLevel', '1');

  out.style.display='block';
  out.innerHTML='<p><b>"'+s+'"</b></p><p style="margin-top:12px;letter-spacing:0.1em">'+ad.join(' • ')+'</p><p style="margin-top:10px;font-size:12px;color:#22c55e">✓ Saved - ready for Level 2</p>';
  next.style.display='block';
  // Scroll to button
  next.scrollIntoView({behavior:'smooth'});
}

function goToLevel2(){
  const saved = localStorage.getItem('myainun_level1');
  if(!saved){
    alert('Click DONE first');
    return;
  }
  // Mark level 1 as completed
  localStorage.setItem('myainun_level1_completed', 'true');
  localStorage.setItem('myainun_currentLevel', '2');
  window.location.href='imajinasilevel2.html';
}
</script>
</body>
</html>
