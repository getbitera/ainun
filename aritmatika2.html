
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Level 2 - 32 Kotak 96 Detik</title>
<style>
 body{margin:0;background:#FFF59D;display:flex;justify-content:center;padding:10px;font-family:sans-serif}
.main{display:flex;gap:10px;max-width:560px;width:100%}
.bebek-box{width:100px;flex-shrink:0;background:#fff;border-radius:20px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,0.15);height:fit-content;position:sticky;top:10px;text-align:center}
.bebek-img{width:100%;border-radius:15px;animation:goyang 0.8s infinite}
 @keyframes goyang{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bubble{background:#2196F3;color:#fff;padding:10px 8px;border-radius:14px;font-weight:800;font-size:12px;margin-bottom:8px}
.card{flex:1;background:#fff;border-radius:20px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,0.15)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0}
.box{aspect-ratio:1;background:#FFFDE7;border:2px solid #FBC02D;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#F57F17;cursor:pointer;touch-action:manipulation}
.box.show-all{background:#FFEB3B;color:#000}
.box.clue{background:#FFF176}
.box.hidden{background:#fff;border-style:dashed}
.box.correct{background:#4CAF50;color:#fff}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.key{padding:10px 0;background:#FBC02D;border:none;border-radius:8px;font-weight:800;cursor:pointer;touch-action:manipulation}
.bar{height:6px;background:#eee;border-radius:10px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;background:#FBC02D;width:100%;transition:width 1s linear}
</style>
</head>
<body>
<div class="main">
  <div class="bebek-box" onclick="ngomong()">
    <div id="bubble" class="bubble">อย่าทำแบบนั้น<br><small>yaa tam baeb nan</small></div>
    <img class="bebek-img" src="maskot_biru_kuning_asia.png">
  </div>
  <div class="card">
    <h3 style="margin:0;color:#F57F17">LEVEL 2 - 32 KOTAK</h3>
    <div style="font-size:11px;display:flex;justify-content:space-between"><span>🧠 Hafal: <b id="time">10</b>s</span><span>⏱ Sisa: <b id="gameTime">96</b>s</span><span>🎯 <b id="prog">0/28</b></span></div>
    <div class="bar"><div id="barFill" class="bar-fill"></div></div>
    <div id="msg" style="font-size:12px;margin-top:6px;text-align:center;color:#F57F17;font-weight:700">Klik mulai</div>
    <div id="grid" class="grid"></div>
    <button id="btnStart" style="width:100%;padding:12px;background:#FBC02D;border:none;border-radius:10px;font-weight:800">MULAI HAFAL 10 DETIK</button>
    <div id="keypadArea" style="display:none;margin-top:8px"><div class="keypad"><button class="key" data-num="0">0</button><button class="key" data-num="1">1</button><button class="key" data-num="2">2</button><button class="key" data-num="3">3</button><button class="key" data-num="4">4</button><button class="key" data-num="5">5</button><button class="key" data-num="6">6</button><button class="key" data-num="7">7</button><button class="key" data-num="8">8</button><button class="key" data-num="9">9</button></div></div>
  </div>
</div>
<script>
let grid=document.getElementById('grid'),msg=document.getElementById('msg'),timeEl=document.getElementById('time'),gameTimeEl=document.getElementById('gameTime'),prog=document.getElementById('prog'),bubble=document.getElementById('bubble'),barFill=document.getElementById('barFill'),selectedBox=null,gameTimer=null,timeLeft=96;

function buatLevel(){
 grid.innerHTML='';prog.textContent='0/28';timeLeft=96;gameTimeEl.textContent=timeLeft;barFill.style.width='100%';barFill.style.background='#FBC02D';
 document.getElementById('keypadArea').style.display='none';clearInterval(gameTimer);
 let nums=Array.from({length:32},()=>Math.floor(Math.random()*10));
 let clues=[];while(clues.length<4)clues=[...new Set([...clues,Math.floor(Math.random()*32)])];
 for(let i=0;i<32;i++){let b=document.createElement('div');b.className='box';b.dataset.angka=nums[i];b.dataset.clue=clues.includes(i);grid.appendChild(b);}
 msg.textContent='Siap? 10 detik hafalan!';timeEl.textContent=10;document.getElementById('btnStart').style.display='block';document.getElementById('btnStart').textContent='MULAI HAFAL 10 DETIK';
 bubble.innerHTML='พร้อมนะ?<br><small>phrom na?</small>';
}

function tampil(){
 grid.querySelectorAll('.box').forEach(b=>{b.textContent=b.dataset.angka;b.classList.add('show-all');});
 let c=10;timeEl.textContent=c;document.getElementById('btnStart').style.display='none';msg.textContent='HAFALKAN 32 ANGKA! 10 DETIK!';
 let t=setInterval(()=>{c--;timeEl.textContent=c;if(c<=0){clearInterval(t);mulaiNgerjain();}},1000);
}

function mulaiNgerjain(){
 grid.querySelectorAll('.box').forEach(b=>{b.classList.remove('show-all');if(b.dataset.clue==='true'){b.classList.add('clue');b.textContent=b.dataset.angka;}else{b.textContent='';b.classList.add('hidden');b.onclick=()=>pilihBox(b);}});
 msg.textContent='WAKTU NGERJAIN 96 DETIK!';document.getElementById('keypadArea').style.display='block';
 let f=document.querySelector('.box.hidden');if(f)pilihBox(f);
 timeLeft=96;barFill.style.width='100%';
 gameTimer=setInterval(()=>{timeLeft--;gameTimeEl.textContent=timeLeft;barFill.style.width=(timeLeft/96*100)+'%';if(timeLeft<=20)barFill.style.background='#f44336';if(timeLeft<=0){clearInterval(gameTimer);bubble.innerHTML='หมดเวลา!<br><small>mot wela!</small>';ngomong('หมดเวลา');setTimeout(()=>buatLevel(),1500);}},1000);
}

function pilihBox(b){if(selectedBox)selectedBox.style.outline='';selectedBox=b;b.style.outline='3px solid #FBC02D';}

function isiAngka(num){
 if(!selectedBox){let f=document.querySelector('.box.hidden');if(f)pilihBox(f);else return;}
 let benar=selectedBox.dataset.angka;
 if(num===benar){
   selectedBox.textContent=num;selectedBox.classList.remove('hidden');selectedBox.classList.add('correct');selectedBox.style.outline='';selectedBox.onclick=null;
   let ok=document.querySelectorAll('.box.correct').length;prog.textContent=ok+'/28';
   let next=document.querySelector('.box.hidden');
   if(next) pilihBox(next);
   else {
     // ====== MENANG LEVEL 2 -> LANJUT KE aritmatika3.html ======
     clearInterval(gameTimer);
     msg.textContent='LEVEL 2 CLEAR!';bubble.innerHTML='เก่งมาก! 🎉<br><small>keng mak!</small>';ngomong('เก่งมาก');
     
     setTimeout(()=>{
       let popup=document.createElement('div');
       popup.style.cssText=`position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;color:#fff;text-align:center;padding:20px`;
       popup.innerHTML=`
         <h1 style="font-size:28px">🎉 LEVEL 2 CLEAR!</h1>
         <p style="margin:12px 0 20px">32 kotak berhasil dihafal!<br>Siap ke Level 3 yang lebih susah?</p>
         <a href="aritmatika3.html" style="background:#FBC02D;color:#000;padding:16px 36px;border-radius:30px;font-weight:900;font-size:20px;text-decoration:none;box-shadow:0 6px 0 #F57F17;display:inline-block">➡️ LANJUT LEVEL 3</a>
         <div style="margin-top:12px;font-size:12px;opacity:0.7">akan ke aritmatika3.html</div>
         <button onclick="this.parentElement.remove();buatLevel()" style="margin-top:20px;background:transparent;color:#fff;border:1px solid #fff;padding:8px 16px;border-radius:20px">Ulang Level 2</button>
       `;
       document.body.appendChild(popup);
       if(navigator.vibrate) navigator.vibrate([100,50,100,50,200]);
     },700);
   }
 } else {
   clearInterval(gameTimer);
   bubble.innerHTML='อย่าทำแบบนั้น! 😝<br><small>yaa tam baeb nan</small>';
   msg.textContent='SALAH! ACAK SOAL BARU...';
   ngomong('อย่าทำแบบนั้น');
   setTimeout(()=>{buatLevel();},1800);
 }
}

document.querySelectorAll('.key').forEach(k=>k.onclick=()=>isiAngka(k.dataset.num));
document.getElementById('btnStart').onclick=tampil;buatLevel();

function ngomong(teks){
 let t=teks||'อย่าทำแบบนั้น';if(t.includes('baeb')||t==='')t='อย่าทำแบบนั้น';
 const u=new SpeechSynthesisUtterance(t);u.lang='th-TH';u.rate=0.9;speechSynthesis.speak(u);
}
</script>
</body>
</html>
