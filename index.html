function renderPlaylist(){
  const pl=document.getElementById('playlist');pl.innerHTML='';

function parseLyrics(text){
  return text.split('\n').map(l=>{
    const t=l.trim();
    if(!t) return '<div class="lyric-line">&nbsp;</div>';
    if(t.startsWith('[')) return `<div class="lyric-line section">${t}</div>`;
    return `<div class="lyric-line">${t}</div>`;
  }).join('');
}

  document.getElementById('lyricTitle').textContent=s.name;
  document.getElementById('lyricSub').textContent='My Ainun • '+s.name+' • Lirik lengkap di bawah';
  document.getElementById('lyricBox').innerHTML=parseLyrics(s.lyrics);
  document.getElementById('lyricSection').classList.add('show');
  renderPlaylist();
  audio.play().catch(()=>{console.log('File belum ada di folder:',s.file);});
}
function nextSong(){
  if(isShuffle){
    let n;do{n=Math.floor(Math.random()*songs.length);}while(songs.length>1&&n===cur);
    openLyric(n);
  }else{cur=(cur+1)%songs.length;openLyric(cur);}
}
function prevSong(){cur=(cur-1+songs.length)%songs.length;openLyric(cur);}
playBtn.onclick=()=>audio.paused?audio.play():audio.pause();
document.getElementById('next').onclick=()=>nextSong();
document.getElementById('prev').onclick=()=>prevSong();
// FIX ACAK OFF
document.getElementById('shuffleBtn').onclick=function(){
  isShuffle=!isShuffle;
  mode=isShuffle?'shuffle':'normal';
  this.classList.toggle('active',isShuffle);
  document.getElementById('shuffleLabel').textContent=isShuffle?'Acak: ON':'Acak: Off';
  document.getElementById('repeat1Btn').classList.remove('active');
  document.getElementById('repeatAllBtn').classList.remove('active');
};
document.getElementById('repeat1Btn').onclick=function(){
  if(mode==='repeat1'){mode='normal';this.classList.remove('active');}
  else{mode='repeat1';this.classList.add('active');document.getElementById('repeatAllBtn').classList.remove('active');isShuffle=false;document.getElementById('shuffleBtn').classList.remove('active');document.getElementById('shuffleLabel').textContent='Acak: Off';}
};
document.getElementById('repeatAllBtn').onclick=function(){
  if(mode==='repeatAll'){mode='normal';this.classList.remove('active');}
  else{mode='repeatAll';this.classList.add('active');document.getElementById('repeat1Btn').classList.remove('active');}
};
document.getElementById('muteBtn').onclick=()=>{audio.muted=!audio.muted;document.getElementById('muteBtn').textContent=audio.muted?'🔇':'🔊';};
document.getElementById('prog').onclick=(e)=>{const r=e.currentTarget.getBoundingClientRect();if(audio.duration)audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;};
audio.addEventListener('timeupdate',()=>{
  const pct=audio.duration?audio.currentTime/audio.duration*100:0;
  document.getElementById('fill').style.width=pct+'%';
  const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  document.getElementById('curTime').textContent=fmt(audio.currentTime||0);
  document.getElementById('durTime').textContent=fmt(audio.duration||0);
});
audio.addEventListener('play',()=>playBtn.textContent='⏸');
audio.addEventListener('pause',()=>playBtn.textContent='▶');
audio.addEventListener('ended',()=>{if(mode==='repeat1'){audio.currentTime=0;audio.play();}else{nextSong();}});
renderPlaylist();
openLyric(0);
</script>
</body>
</html>
