<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOINJOBS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;margin:0;background:#f0f2f5}
.header{background:#1877f2;color:white;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.btn{background:#1877f2;color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer}
.btn-batal{background:#ccc;color:#000}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center}
.modal-content{background:white;padding:20px;border-radius:8px;width:90%;max-width:400px}
.input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <b>KOINJOBS</b>
  <div id="headerBtn">
    <button class="btn" onclick="openModal('login')">LOGIN</button>
    <button class="btn" onclick="openModal('daftar')">DAFTAR</button>
  </div>
  <div id="headerUser" style="display:none">
    Halo <span id="namaUser"></span> | Saldo: <span id="saldoKoin">0</span> Koin
    <button class="btn btn-batal" onclick="logoutUser()">LOGOUT</button>
  </div>
</div>

<div style="padding:20px;text-align:center">
  <h1>Selamat Datang di KOINJOBS</h1>
  <p>Login dulu untuk mulai</p>
</div>

<!-- MODAL LOGIN -->
<div class="modal" id="login">
  <div class="modal-content">
    <h2>LOGIN</h2>
    <input class="input" type="email" id="loginEmail" placeholder="Email">
    <input class="input" type="password" id="loginPass" placeholder="Password">
    <button class="btn" style="width:100%" onclick="loginUser(event)">LOGIN</button>
    <button class="btn btn-batal" style="width:100%;margin-top:8px" onclick="closeModal('login')">TUTUP</button>
  </div>
</div>

<!-- MODAL DAFTAR -->
<div class="modal" id="daftar">
  <div class="modal-content">
    <h2>DAFTAR</h2>
    <input class="input" type="text" id="daftarNama" placeholder="Nama Lengkap">
    <input class="input" type="email" id="daftarEmail" placeholder="Email">
    <input class="input" type="password" id="daftarPass" placeholder="Password">
    <label><input type="checkbox" id="setujuTOS"> Saya setuju TOS</label>
    <button class="btn" style="width:100%;margin-top:8px" onclick="daftarUser(event)">DAFTAR</button>
    <button class="btn btn-batal" style="width:100%;margin-top:8px" onclick="closeModal('daftar')">TUTUP</button>
  </div>
</div>

<script>
// ===== PART 1: KONEKSI SUPABASE =====
const SUPABASE_URL = 'https://rnupizmvcthcxfardrjn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJudXBpem12Y3RoY3hmYXJkcmpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxOTgyMjAsImV4cCI6MjEwMzc3NDIyMH0.bziH5H4MvNZV1OviYKTU8aJSQd-DzPklPmy3SgmUVpA';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ===== PART 2: LOGIKA JS =====
let userLogin = null;

// 1. CEK LOGIN SAAT BUKA HALAMAN
supabase.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    userLogin = session.user;
    loadUserData();
  }
});
supabase.auth.onAuthStateChange((_event, session) => {
  userLogin = session?.user || null;
  if (userLogin) {
    loadUserData();
  } else {
    document.getElementById('headerBtn').style.display = 'block';
    document.getElementById('headerUser').style.display = 'none';
  }
});

// 2. AMBIL DATA USER DARI TABEL users
async function loadUserData() {
  if(!userLogin) return;
  const { data } = await supabase.from('users').select('*').eq('id', userLogin.id).single();
  if(data){
    document.getElementById('saldoKoin').innerText = data.saldo_koin.toLocaleString();
    document.getElementById('namaUser').innerText = data.nama;
    document.getElementById('headerBtn').style.display = 'none';
    document.getElementById('headerUser').style.display = 'block';
  }
}

// 3. FUNGSI DAFTAR
window.daftarUser = async function(e){
  e.preventDefault();
  const nama = document.getElementById('daftarNama').value;
  const email = document.getElementById('daftarEmail').value;
  const pass = document.getElementById('daftarPass').value;
  const setuju = document.getElementById('setujuTOS').checked;
  
  if(!setuju) return alert('Centang TOS dulu');
  if(!nama || !email || !pass) return alert('Lengkapi data');
  
  const { data, error } = await supabase.auth.signUp({ email: email, password: pass });
  if(error) return alert('Gagal daftar: ' + error.message);
  
  await new Promise(resolve => setTimeout(resolve, 500)); // tunggu session kebentuk
  
  const { error: err2 } = await supabase.from('users').insert({
    id: data.user.id, nama: nama, email: email, saldo_koin: 0
  });
  if(err2) return alert('Gagal simpan ke users: ' + err2.message);
  
  alert('Daftar berhasil! Cek email untuk verifikasi');
  closeModal('daftar');
}

// 4. FUNGSI LOGIN
window.loginUser = async function(e){
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  if(!email || !pass) return alert('Lengkapi data');

  const { error } = await supabase.auth.signInWithPassword({ email: email, password: pass });
  if(error) return alert('Gagal login: ' + error.message);
  
  closeModal('login');
}

// 5. FUNGSI LOGOUT
window.logoutUser = async function(){
  await supabase.auth.signOut();
  userLogin = null;
  alert('Logout berhasil');
}

// 6. FUNGSI BUKA TUTUP MODAL
window.openModal = function(id){ document.getElementById(id).style.display = 'flex'; }
window.closeModal = function(id){ document.getElementById(id).style.display = 'none'; }
</script>

</body>
</html>
