<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXTREME - Color Blind Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#050505;color:#fff;display:flex;flex-direction:column;align-items:center;padding:8px}
.header{width:100%;max-width:430px;background:#ff0040;color:#fff;padding:10px;border-radius:12px;text-align:center;font-weight:900;letter-spacing:1px}
#gameBox{width:100%;max-width:430px;background:#111;border-radius:20px;margin-top:10px;padding:10px;text-align:center;border:2px solid #ff0040}
canvas{width:100%;max-width:380px;aspect-ratio:1;background:#fff;border-radius:50%;margin:6px auto;display:block;box-shadow:0 0 0 5px #fff}
#q{font-size:14px;font-weight:900;color:#ffcc00}#timerWrap{width:100%;height:10px;background:#333;border-radius:10px;margin:6px 0;overflow:hidden}
#timerBar{height:100%;width:100%;background:linear-gradient(90deg,#ff0040,#ffcc00);transition:width .1s linear}
.inputRow{display:flex;gap:6px;justify-content:center}
input{width:70px;padding:12px;border-radius:10px;border:none;text-align:center;font-size:20px;font-weight:900}
.btn{padding:12px 14px;border:none;border-radius:10px;font-weight:900;cursor:pointer}
.btn-ok{background:#00ff88;color:#000}.btn-skip{background:#333;color:#fff}
#result{display:none;width:100%;max-width:430px;background:#fff;color:#000;border-radius:20px;padding:16px;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="header">☠️ EXTREME MODE ☠️<br><small style="font-weight:400;font-size:10px">2% DIFFERENCE - FOR PILOTS - INCLUDES EMPTY TRAPS</small></div>
<div id="gameBox">
<div id="timerWrap"><div id="timerBar"></div></div>
<div id="q">LV <span id="lv">1</span>/12 - <span id="hint"></span></div>
<canvas id="plate" width="700" height="700"></canvas>
<div class="inputRow">
<input id="ans" type="tel" placeholder="?" inputmode="numeric">
<button class="btn btn-ok" onclick="check()">OK</button>
<button class="btn btn-skip" onclick="skip()">EMPTY</button>
</div>
<div style="font-size:9px;color:#666;margin-top:4px">Level 7 & 11 are TRAPS - really empty, answer EMPTY</div>
</div>
<div id="result">
<h2 id="resTitle"></h2>
<p id="resDesc" style="margin:8px 0;font-size:13px"></p>
<div id="detail" style="text-align:left;background:#eee;padding:10px;border-radius:10px;font-size:11px"></div>
<button class="btn" style="background:#ff0040;color:#fff;width:100%;margin-top:10px;padding:14px" onclick="location.reload()">RESTART EXTREME 🔥</button>
</div>
<script>
const levels=[
 {num:12, fg:[255,110,50], bg:[80,175,85], type:'normal', diff:'8%'},
 {num:8, fg:[215,75,75], bg:[85,160,85], type:'normal', diff:'7%'},
 {num:6, fg:[125,175,95], bg:[165,145,75], type:'deutan', diff:'4% - EXTREME'},
 {num:29, fg:[185,90,80], bg:[95,125,85], type:'protan', diff:'3% - EXTREME'},
 {num:5, fg:[120,168,92], bg:[160,142,78], type:'deutan', diff:'3% - EXTREME'},
 {num:74, fg:[180,95,85], bg:[90,122,88], type:'protan', diff:'3% - EXTREME'},
 {num:0, fg:[0,0,0], bg:[0,0,0], type:'trap', diff:'EMPTY TRAP!'},
 {num:3, fg:[75,150,195], bg:[75,180,160], type:'tritan', diff:'2% - INSANE'},
 {num:16, fg:[195,95,80], bg:[85,160,90], type:'normal', diff:'6%'},
 {num:2, fg:[78,145,200], bg:[78,175,160], type:'tritan', diff:'2% - INSANE'},
 {num:0, fg:[0,0,0], bg:[0,0,0], type:'trap', diff:'EMPTY TRAP #2'},
 {num:9, fg:[180,90,85], bg:[90,150,88], type:'normal', diff:'5%'},
];
let cur=0, score=0, misses={protan:0,deutan:0,tritan:0,normal:0,trap:0}, timeLeft=8, timer=null;

function drawPlate(num, fg, bg, type){
 const c=document.getElementById('plate');
 const ctx=c.getContext('2d');
 const W=700,H=700;
 ctx.clearRect(0,0,W,H);
 if(type==='trap'){
   ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
   for(let i=0;i<8000;i++){
     let x=Math.random()*W,y=Math.random()*H;
     if(Math.hypot(x-W/2,y-H/2)>295) continue;
     let r=2+Math.random()*7;
     let col=`rgb(${120+Math.random()*40},${140+Math.random()*40},${90+Math.random()*40})`;
     ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
   }
   return;
 }
 ctx.fillStyle='#000';
 ctx.font='bold 240px Arial Black';
 ctx.textAlign='center'; ctx.textBaseline='middle';
 ctx.fillText(String(num),W/2,H/2+10);
 const mask=ctx.getImageData(0,0,W,H).data;
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
 for(let i=0;i<8500;i++){
   let x=Math.random()*W,y=Math.random()*H;
   if(Math.hypot(x-W/2,y-H/2)>298) continue;
   let r=1.5+Math.random()*5.5;
   let idx=(Math.floor(y)*W+Math.floor(x))*4;
   let isNum=mask[idx+3]>30;
   let base=isNum?fg:bg;
   let v=(Math.random()-0.5)*10;
   let col=`rgb(${Math.max(0,Math.min(255,base[0]+v))},${Math.max(0,Math.min(255,base[1]+v))},${Math.max(0,Math.min(255,base[2]+v))})`;
   ctx.fillStyle=col;
   ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
 }
}

function startTimer(){
 timeLeft=8; 
 if(timer) clearInterval(timer);
 timer=setInterval(()=>{
   timeLeft-=0.1;
   document.getElementById('timerBar').style.width=(timeLeft/8*100)+'%';
   if(timeLeft<=0){ clearInterval(timer); skip(); }
 },100);
}

function loadLevel(){
 if(cur>=levels.length){showResult();return;}
 let l=levels[cur];
 document.getElementById('lv').innerText=cur+1;
 document.getElementById('hint').innerText=l.diff + (l.type!=='trap' ? ` [${l.type}]`:'');
 document.getElementById('ans').value='';
 drawPlate(l.num,l.fg,l.bg,l.type);
 startTimer();
}

function check(){
 clearInterval(timer);
 let v=document.getElementById('ans').value.trim();
 let l=levels[cur];
 let ansNum = v==='' ? -1 : parseInt(v);
 if(l.type==='trap'){
   misses.trap++;
 }else{
   if(ansNum===l.num) score++; else misses[l.type]++;
 }
 cur++; loadLevel();
}
function skip(){
 clearInterval(timer);
 let l=levels[cur];
 if(l.type==='trap'){
   score++;
 }else{
   misses[l.type]++;
 }
 cur++; loadLevel();
}
function showResult(){
 document.getElementById('gameBox').style.display='none';
 document.getElementById('result').style.display='block';
 let title='',desc='';
 if(misses.trap>0) title=`TRAPPED! Score ${score}/12`;
 else if(score>=10) title=`GOD EYE! ${score}/12 👁️🔥`;
 else if(score>=7) title=`Not bad ${score}/12 - Extreme is brutal`;
 else if(score>=4) title=`Normal in Extreme = Great - ${score}/12`;
 else title=`It's normal to miss many - Extreme ${score}/12`;

 if(score<=3 && misses.deutan+misses.protan>=5) desc='You missed many red-green plates. In extreme mode even normal people miss 4-5, but if you miss 5+ on deutan/protan, you might have color deficiency.';
 else if(score>=9) desc='Insane, you can see 2% difference. You are not color blind, you might be super normal (possible tetrachromat).';
 else desc='Extreme mode difference is only 2-4%. Even normal vision often scores only 6-8. Don\'t panic if you miss many.';

 document.getElementById('resTitle').innerText=title;
 document.getElementById('resDesc').innerText=desc;
 document.getElementById('detail').innerHTML=`
   Score: ${score}/12<br>
   Miss Protan: ${misses.protan}/3, Deutan: ${misses.deutan}/3, Tritan: ${misses.tritan}/2<br>
   Empty traps: ${misses.trap===0?'Passed ✅':'Failed ❌ - You answered a number but it was empty'}<br>
   Normal miss: ${misses.normal}/4<br><br>
   <b>Extreme Notes:</b><br>
   - RGB difference only 10-15 points (normal needs 30+ points)<br>
   - 8500 dots + tiny 1.5px<br>
   - Level 7 & 11 are intentionally EMPTY<br>
   - For normal test, use hard mode
 `;
}
loadLevel();
</script>
</body>
</html>
