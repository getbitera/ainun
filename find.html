<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WELCOME TO MY AINUN FIND THE SPOT - 7 LEVELS</title>
<style>
body{margin:0;background:#FFF9C4;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial}
.container{background:white;padding:14px;border-radius:20px;border:4px solid #FFD600;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.15);width:96%;max-width:420px;position:relative}
h2{margin:0 0 4px;font-size:13px;line-height:1.2}
.info{display:flex;justify-content:space-between;font-weight:900;margin-bottom:6px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.item{width:100%;aspect-ratio:1;background:#FFF9C4;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid transparent;transition:0.1s}
.item:hover{transform:scale(1.1);border-color:#FFC107}
#timerBar{height:10px;background:#FFECB3;border-radius:6px;overflow:hidden;margin-bottom:6px}
#bar{height:100%;background:linear-gradient(90deg,#ff6b6b,#ffcc00);width:100%;transition:width 0.1s linear}
#stageBar{height:8px;background:#eee;border-radius:6px;overflow:hidden;margin-bottom:6px}
#stageFill{height:100%;background:#00C853;width:0%;transition:width 0.3s}
#winScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.98);border-radius:16px;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:16px;box-sizing:border-box}
.btn{background:#FFC107;border:none;padding:10px 18px;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;margin-top:10px;box-shadow:0 4px 0 #FF8F00}
.btn:active{transform:translateY(3px);box-shadow:none}
</style>
</head>
<body>
<div class="container">
<div id="winScreen">
<h1 id="winTitle" style="font-size:18px;color:#FF6F00;text-align:center"></h1>
<p id="winDesc" style="font-size:12px;text-align:center"></p>
<p style="font-size:13px">Skor: <b id="finalScore">0</b></p>
<div id="stageBarWin" style="width:100%;height:10px;background:#eee;border-radius:6px;overflow:hidden;margin-top:6px"><div id="stageFillWin" style="height:100%;background:#00C853;width:0%"></div></div>
<button class="btn" id="nextBtn" onclick="nextLevel()">➡️ LANJUT</button>
</div>

<h2 id="title">💛 WELCOME TO MY AINUN</h2>
<div id="target" style="font-size:10px;background:#FFF9C4;padding:5px;border-radius:8px;margin-bottom:4px;font-weight:bold">...</div>
<div id="progress" style="font-size:11px;font-weight:900;color:#FF6F00">0/1</div>
<div class="info"><span id="level">Level 1 - Stage 1/30</span><span id="score">Skor: 0</span></div>
<div id="stageBar"><div id="stageFill"></div></div>
<div id="timerBar"><div id="bar"></div></div>
<div id="grid" class="grid"></div>
<p id="msg" style="font-size:10px;color:#666;margin-top:6px">WELCOME TO MY AINUN - Level 1:30 stage, Level 2:40 stage... sampe Level 7:100 stage!</p>
</div>

<script>
let currentLevel = 1;
let currentStage = 1;
const levelConfigs = {
  1: { stages: 30, need: 1 },
  2: { stages: 40, need: 2 },
  3: { stages: 50, need: 3 },
  4: { stages: 60, need: 4 },
  5: { stages: 70, need: 5 },
  6: { stages: 80, need: 6 },
  7: { stages: 100, need: 7 }
};
let maxLevel = 7;
let score = 0;
let time, timer, sisaWaktu, found=0, needToFind=1;
const gridEl = document.getElementById('grid');
const barEl = document.getElementById('bar');

const themes = [
  { same: '🍎', diffs: ['🍓','🍑','🍒','🥝','🍋','🍇','🫐','🍍','🍈','🍊'] },
  { same: '🐶', diffs: ['🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁'] },
  { same: '⚽', diffs: ['🏀','🏈','🎾','🏐','🏓','🎱','🏸','🥎','🏒','🥍'] },
  { same: '🚗', diffs: ['🚕','🚙','🚌','🚎','🏎️','🚓','🚑','🚒','🚐','🛻'] },
  { same: '⭐', diffs: ['🌟','💛','🌙','☀️','🌈','🔥','💖','💚','💙','💜'] },
  { same: '🔵', diffs: ['🟢','🟡','🔴','🟣','🟠','⚫','⚪','🟤','🔶','🔷'] },
  { same: '🌸', diffs: ['🌺','🌷','🌹','💐','🌻','🪷','🌼','🌷','🪻','🌾'] }
];

function buatStage(){
  gridEl.innerHTML=''; found=0;
  let cfg = levelConfigs[currentLevel];
  needToFind = cfg.need;
  let theme = themes[Math.floor(Math.random()*themes.length)];
  let total=49;
  let pos=[];
  while(pos.length<needToFind){ let r=Math.floor(Math.random()*total); if(!pos.includes(r)) pos.push(r); }
  let diffsToFind = [];
  // acak diffs biar beda tiap stage
  let shuffled = [...theme.diffs].sort(()=>0.5-Math.random());
  diffsToFind = shuffled.slice(0,needToFind);

  document.getElementById('level').innerText = `Level ${currentLevel}/${maxLevel} - Stage ${currentStage}/${cfg.stages}`;
  document.getElementById('title').innerHTML = `💛 WELCOME TO MY AINUN<br>LEVEL ${currentLevel} - CARI ${needToFind} SPOT (Stage ${currentStage}/${cfg.stages})`;
  document.getElementById('target').innerText = `Cari ${needToFind}: ${diffsToFind.join(' ')} di antara ${theme.same}`;
  document.getElementById('progress').innerText = `Ditemukan: 0/${needToFind}`;
  document.getElementById('stageFill').style.width = `${(currentStage/cfg.stages*100)}%`;
  
  time = Math.max(3, 9 - currentLevel*0.3);
  startTimer();

  for(let i=0;i<total;i++){
    let div=document.createElement('div'); div.className='item';
    let idx = pos.indexOf(i);
    if(idx!==-1){ div.innerHTML=diffsToFind[idx]; div.onclick=()=>ketemu(div); }
    else { div.innerHTML=theme.same; div.onclick=()=>salah(); }
    gridEl.appendChild(div);
  }
}

function startTimer(){
  clearInterval(timer); sisaWaktu=time; barEl.style.width='100%';
  timer=setInterval(()=>{
    sisaWaktu-=0.1; barEl.style.width=(sisaWaktu/time*100)+'%';
    if(sisaWaktu<=0){ clearInterval(timer); alert(`Waktu habis! MY AINUN Level ${currentLevel} Stage ${currentStage} - Ulangi stage ini!`); buatStage(); }
  },100);
}

function ketemu(el){
  el.style.background='#00C853'; el.style.color='white'; el.innerHTML='💛'; el.style.pointerEvents='none';
  found++; document.getElementById('progress').innerText=`Ditemukan: ${found}/${needToFind}`;
  if(found===needToFind){
    clearInterval(timer);
    score+= 10*currentLevel*needToFind;
    document.getElementById('score').innerText='Skor: '+score;
    
    let cfg = levelConfigs[currentLevel];
    if(currentStage >= cfg.stages){
      // SELESAI 1 LEVEL PENUH
      if(currentLevel>=maxLevel){
        document.getElementById('winTitle').innerHTML=`🏆 WELCOME TO MY AINUN<br>TAMAT SEMUA 7 LEVEL! 🏆`;
        document.getElementById('winDesc').innerHTML=`Gila! Kamu selesaikan total ${Object.values(levelConfigs).reduce((a,b)=>a+b.stages,0)} stage!<br>Level 1:30, Level 2:40, L3:50, L4:60, L5:70, L6:80, L7:100`;
        document.getElementById('finalScore').innerText=score;
        document.getElementById('stageFillWin').style.width='100%';
        document.getElementById('nextBtn').style.display='none';
        document.getElementById('winScreen').style.display='flex';
      } else {
        document.getElementById('winTitle').innerText=`🎉 LEVEL ${currentLevel} SELESAI! (${cfg.stages} STAGE)`;
        document.getElementById('winDesc').innerText=`Level ${currentLevel} dengan ${cfg.stages} stage acak selesai! Selanjutnya Level ${currentLevel+1} harus cari ${levelConfigs[currentLevel+1].need} spot dalam ${levelConfigs[currentLevel+1].stages} stage!`;
        document.getElementById('finalScore').innerText=score;
        document.getElementById('stageFillWin').style.width='100%';
        document.getElementById('nextBtn').innerText=`➡️ LANJUT LEVEL ${currentLevel+1} (${levelConfigs[currentLevel+1].stages} STAGE)`;
        document.getElementById('winScreen').style.display='flex';
      }
    } else {
      // LANJUT STAGE BERIKUTNYA DALAM LEVEL YANG SAMA
      currentStage++;
      setTimeout(buatStage, 300);
    }
  }
}

function salah(){ sisaWaktu=Math.max(0.2,sisaWaktu-1); document.getElementById('msg').innerText=`❌ Salah -1 detik! Stage ${currentStage}/${levelConfigs[currentLevel].stages} MY AINUN`; }

function nextLevel(){
  document.getElementById('winScreen').style.display='none';
  currentLevel++; currentStage=1;
  buatStage();
}

buatStage();
</script>
</body>
</html>
