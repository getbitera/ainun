<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cari Beda - Level 1 to 2</title>
<style>
body{margin:0;background:#FFF9C4;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial}
.container{background:white;padding:16px;border-radius:20px;border:4px solid #FFD600;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.15);width:96%;max-width:420px;position:relative}
h2{margin:0 0 6px;font-size:18px}
.info{display:flex;justify-content:space-between;font-weight:900;margin-bottom:8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.item{width:100%;aspect-ratio:1;background:#FFF9C4;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;border:2px solid transparent;transition:0.1s}
.item:hover{transform:scale(1.1);border-color:#FFC107}
#timerBar{height:12px;background:#FFECB3;border-radius:6px;overflow:hidden;margin-bottom:8px}
#bar{height:100%;background:#FFC107;width:100%;transition:width 0.1s linear}
#winScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.97);border-radius:16px;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:20px;box-sizing:border-box}
#winScreen h1{font-size:28px;margin:0;color:#FF6F00}
#winScreen p{font-size:14px}
.btn{background:#FFC107;border:none;padding:12px 20px;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;margin-top:12px;box-shadow:0 4px 0 #FF8F00}
.btn:active{transform:translateY(3px);box-shadow:none}
</style>
</head>
<body>
<div class="container">
<div id="winScreen">
<h1>🎉 MENANG LEVEL 1! 🎉</h1>
<p>Kamu berhasil tembus <b>100 Level</b> Cari 1 Gambar!</p>
<p>Skor: <span id="finalScore">0</span></p>
<p style="font-size:12px;color:#666">Selanjutnya bakal lebih susah, harus cari 2 gambar sekaligus!</p>
<button class="btn" onclick="lanjutLevel2()">➡️ LANJUT LEVEL 2</button>
</div>

<h2 id="title">🟡 LEVEL 1 - CARI 1 BEDA</h2>
<div id="target" style="font-size:11px;background:#FFF9C4;padding:6px;border-radius:10px;margin-bottom:6px;font-weight:bold">Cari: ...</div>
<div id="progress"></div>
<div class="info"><span id="level">Level 1/100</span><span id="score">Skor: 0</span></div>
<div id="timerBar"><div id="bar"></div></div>
<div id="grid" class="grid"></div>
<p id="msg" style="font-size:11px;color:#666;margin-top:8px">Tamatkan 100 level untuk buka Level 2!</p>
</div>

<script>
let level = 1;
let maxLevel1 = 100;
let mode = 1; // 1 = cari 1, 2 = cari 2
let score = 0;
let time, timer, sisaWaktu;
let found = 0;
const gridEl = document.getElementById('grid');
const barEl = document.getElementById('bar');

const themes1 = [
  { same: '🍎', diff: '🍓' }, { same: '🐶', diff: '🐱' }, { same: '⚽', diff: '🏀' },
  { same: '🚗', diff: '🚕' }, { same: '⭐', diff: '🌟' }, { same: '🔵', diff: '🟢' }
];
const themes2 = [
  { same: '🍪', diffs: ['🍩','🧁'] }, { same: '🐝', diffs: ['🐞','🦋'] }, { same: '🎃', diffs: ['🍎','🍑'] }
];

function buatLevel(){
  gridEl.innerHTML='';
  found=0;
  let theme, total, pos=[];
  let isMode1 = (mode===1);

  if(isMode1){
    total=49; // 7x7
    gridEl.style.gridTemplateColumns='repeat(7,1fr)';
    theme = themes1[Math.floor(Math.random()*themes1.length)];
    pos.push(Math.floor(Math.random()*total));
    document.getElementById('target').innerText = `Cari: ${theme.diff} di antara ${theme.same}`;
    document.getElementById('progress').innerText = '';
    time = Math.max(1.2, 5 - level*0.02);
  } else {
    total=49;
    gridEl.style.gridTemplateColumns='repeat(7,1fr)';
    theme = themes2[Math.floor(Math.random()*themes2.length)];
    while(pos.length<2){let r=Math.floor(Math.random()*total); if(!pos.includes(r)) pos.push(r)}
    document.getElementById('target').innerText = `Cari: ${theme.diffs.join(' ')}`;
    document.getElementById('progress').innerText = `Ditemukan: 0/2`;
    time = Math.max(1.5, 7 - (level-100)*0.02);
  }

  document.getElementById('level').innerText = isMode1 ? `Level ${level}/100` : `Level ${level} (Level 2)`;
  document.getElementById('title').innerText = isMode1 ? '🟡 LEVEL 1 - CARI 1 BEDA' : '🟠 LEVEL 2 - CARI 2 BEDA';
  startTimer();

  for(let i=0;i<total;i++){
    let div=document.createElement('div'); div.className='item';
    if(pos.includes(i)){
      if(isMode1){ div.innerHTML=theme.diff; }
      else { div.innerHTML=theme.diffs[pos.indexOf(i)]; }
      div.onclick=()=>ketemu(div);
    } else {
      div.innerHTML=theme.same; div.onclick=()=>salah();
    }
    gridEl.appendChild(div);
  }
}

function startTimer(){
  clearInterval(timer); sisaWaktu=time; barEl.style.width='100%';
  timer=setInterval(()=>{
    sisaWaktu-=0.1; barEl.style.width=(sisaWaktu/time*100)+'%';
    if(sisaWaktu<=0){clearInterval(timer); alert('Waktu habis! Ulang dari Level '+level); buatLevel();}
  },100);
}

function ketemu(el){
  if(mode===1){
    // LANGSUNG MENANG 1 LEVEL
    el.innerHTML='✅'; score+=10*level;
    document.getElementById('score').innerText='Skor: '+score;
    level++;
    if(level > maxLevel1){
      // MENANG LEVEL 1!
      clearInterval(timer);
      document.getElementById('finalScore').innerText=score;
      document.getElementById('winScreen').style.display='flex';
    } else {
      setTimeout(buatLevel,300);
    }
  } else {
    el.style.background='#00C853'; el.style.color='white'; el.innerHTML='✅'; el.style.pointerEvents='none';
    found++;
    document.getElementById('progress').innerText=`Ditemukan: ${found}/2`;
    if(found===2){
      clearInterval(timer); score+=20*level;
      document.getElementById('score').innerText='Skor: '+score;
      level++; setTimeout(buatLevel,500);
    }
  }
}

function salah(){ sisaWaktu=Math.max(0.2,sisaWaktu-1); document.getElementById('msg').innerText='❌ Salah -1 detik!'; }

function lanjutLevel2(){
  document.getElementById('winScreen').style.display='none';
  mode=2;
  // level lanjut 101
  if(level<=100) level=101;
  document.getElementById('msg').innerText='Level 2 dimulai! Sekarang cari 2 gambar!';
  buatLevel();
}

buatLevel();
</script>
</body>
</html>
